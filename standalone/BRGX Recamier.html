<!doctype html>
<html lang="pt-BR" data-brgx-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#efece5" />
<title>MEU · Recamier</title>
<link rel="stylesheet" href="../assets/brgx-tokens.css" />
<style>
/* Coluna única, muito espaço em branco — contraste deliberado com o Dashboard denso */
body{padding-bottom:60px}
.brgx-shell{max-width:440px;gap:26px}

.agenda-strip{display:flex;flex-direction:column;gap:8px}
.agenda-item{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.agenda-item:last-child{border-bottom:none}
.agenda-when{font:700 11px/1 Inter,sans-serif;color:var(--accent);flex:0 0 auto}
.agenda-note{font:400 13px/1.4 Inter,sans-serif;color:var(--ink);flex:1}
.agenda-item button{background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer}

.thread{display:flex;flex-direction:column;gap:22px;margin-top:6px}
.thread-entry{padding-left:16px;border-left:2px solid var(--line)}
.thread-date{font:700 10px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.thread-text{font:400 15px/1.7 Newsreader,Georgia,serif;color:var(--ink);margin:0}
.thread-actions{display:flex;gap:10px;margin-top:8px}
.thread-actions button{background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer}
.thread-actions button.danger{color:var(--danger)}

.memorial-toggle{width:100%;text-align:left;background:var(--track);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:600 12.5px/1.4 Inter,sans-serif;color:var(--ink-soft);cursor:pointer}
.memorial-body{display:none;margin-top:8px}
.memorial-body.open{display:block}
.memorial-body textarea{width:100%;min-height:140px;font:400 13px/1.5 Inter,sans-serif;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);resize:vertical}

.session-form{display:flex;flex-direction:column;gap:10px}
.session-form textarea{min-height:90px;font:400 14px/1.6 Newsreader,Georgia,serif;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);resize:vertical}
</style>
</head>
<body>

<div class="brgx-head">
  <a class="brgx-back" href="../index.html">← MEU</a>
  <p class="brgx-eyebrow">MEU.app/recamier · pessoal</p>
  <h1>Recamier</h1>
  <p>Espaço de escuta, não de resposta pronta. Dr. Charles escuta — o registro fica aqui.</p>
</div>

<div class="brgx-shell">

  <div>
    <p class="section-label" style="margin-bottom:8px">Agenda</p>
    <div class="card">
      <div class="agenda-strip" id="agenda"></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="mini-btn" id="agendarBtn" style="width:100%">Agendar sessão</button>
      </div>
    </div>
  </div>

  <div>
    <p class="section-label" style="margin-bottom:8px">Nova sessão</p>
    <form class="session-form" id="sessionForm">
      <textarea id="sessionText" placeholder="O que veio à tona hoje…" required></textarea>
      <button type="submit" class="mini-btn solid">Iniciar sessão</button>
    </form>
  </div>

  <div>
    <p class="section-label" style="margin-bottom:8px">Registro</p>
    <div class="thread" id="thread"></div>
  </div>

  <div>
    <button type="button" class="memorial-toggle" id="memorialToggle">Memorial (dados sensíveis) — toque para abrir</button>
    <div class="memorial-body" id="memorialBody">
      <textarea id="memorialText" placeholder="Perfil, gatilhos, padrões — só você vê isso, guardado neste navegador."></textarea>
      <div class="btn-row" style="margin-top:8px">
        <button class="mini-btn solid" id="memorialSave" style="width:100%">Salvar memorial</button>
      </div>
    </div>
  </div>

</div>

<script src="../assets/brgx-shared.js"></script>
<script>
(function(){
  let sessions = brgxStorageGet('brgx-recamier-sessions', []);
  let agenda = brgxStorageGet('brgx-recamier-agenda', []);
  let memorial = brgxStorageGet('brgx-recamier-memorial', '');

  function saveSessions(){ brgxStorageSet('brgx-recamier-sessions', sessions); }
  function saveAgenda(){ brgxStorageSet('brgx-recamier-agenda', agenda); }

  function renderAgenda(){
    const el = document.getElementById('agenda');
    el.innerHTML = '';
    if(agenda.length===0){
      el.innerHTML = '<p style="color:var(--ink-soft);font-size:13px">Nenhuma sessão agendada.</p>';
      return;
    }
    agenda.sort((a,b)=> (a.when||'').localeCompare(b.when||'')).forEach(a=>{
      const row = document.createElement('div');
      row.className = 'agenda-item';
      row.innerHTML = `<span class="agenda-when"></span><span class="agenda-note"></span><button data-id="${a.id}">excluir</button>`;
      row.querySelector('.agenda-when').textContent = a.when;
      row.querySelector('.agenda-note').textContent = a.note;
      el.appendChild(row);
    });
    el.querySelectorAll('button[data-id]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        agenda = agenda.filter(a=>a.id!==btn.dataset.id);
        saveAgenda(); renderAgenda();
      });
    });
  }

  function renderThread(){
    const el = document.getElementById('thread');
    el.innerHTML = '';
    if(sessions.length===0){
      el.innerHTML = '<p style="color:var(--ink-soft);font-size:13px">Nenhuma sessão registrada ainda.</p>';
      return;
    }
    [...sessions].reverse().forEach(s=>{
      const entry = document.createElement('div');
      entry.className = 'thread-entry';
      entry.innerHTML = `
        <p class="thread-date"></p>
        <p class="thread-text"></p>
        <div class="thread-actions">
          <button data-act="edit" data-id="${s.id}">editar</button>
          <button data-act="del" data-id="${s.id}" class="danger">excluir</button>
        </div>`;
      entry.querySelector('.thread-date').textContent = s.date;
      entry.querySelector('.thread-text').textContent = s.text;
      el.appendChild(entry);
    });
    el.querySelectorAll('[data-act="edit"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const s = sessions.find(x=>x.id===btn.dataset.id);
        const novo = prompt('Editar registro da sessão', s.text);
        if(novo && novo.trim()){ s.text = novo.trim(); saveSessions(); renderThread(); }
      });
    });
    el.querySelectorAll('[data-act="del"]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = await brgxConfirm({title:'Excluir sessão', text:'Esse registro será apagado permanentemente. Continuar?', confirmLabel:'Excluir'});
        if(!ok) return;
        sessions = sessions.filter(s=>s.id!==btn.dataset.id);
        saveSessions(); renderThread();
      });
    });
  }

  document.getElementById('sessionForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const text = document.getElementById('sessionText').value.trim();
    if(!text) return;
    sessions.push({id:'s'+Date.now(), date:brgxDateLine(), text});
    saveSessions();
    document.getElementById('sessionText').value='';
    renderThread();
  });

  document.getElementById('agendarBtn').addEventListener('click', ()=>{
    const when = prompt('Quando? (ex: sáb, 14h)');
    if(!when) return;
    const note = prompt('Nota (opcional)') || 'Sessão';
    agenda.push({id:'a'+Date.now(), when, note});
    saveAgenda(); renderAgenda();
  });

  const memorialBody = document.getElementById('memorialBody');
  document.getElementById('memorialToggle').addEventListener('click', ()=>{
    memorialBody.classList.toggle('open');
  });
  document.getElementById('memorialText').value = memorial;
  document.getElementById('memorialSave').addEventListener('click', ()=>{
    memorial = document.getElementById('memorialText').value;
    brgxStorageSet('brgx-recamier-memorial', memorial);
  });

  renderAgenda();
  renderThread();
})();
</script>
<script src="../assets/brgx-specialist.js"></script>
<script>brgxInitSpecialist('charles');</script>
</body>
</html>
