<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#08080A" />
<title>MEU · Biblioteca</title>
<link rel="stylesheet" href="../assets/brgx-tokens.css" />
<style>
/* Estante — lombadas de livro em prateleira horizontal, leitor com "atmosfera" por clima do livro */
body{padding-bottom:40px}

.shelf-scroll{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px}
.spine{flex:0 0 auto;width:72px;height:170px;border-radius:8px 10px 10px 8px;padding:12px 8px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:2px 3px 8px rgba(28,26,22,.15);border-left:4px solid rgba(0,0,0,.15)}
.spine .titulo{font:700 11px/1.25 Newsreader,Georgia,serif;color:#fff;writing-mode:vertical-rl;text-orientation:mixed;max-height:120px;overflow:hidden}
.spine .status{font:700 8.5px/1 Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:rgba(255,255,255,.85)}
.spine.quero{background:linear-gradient(160deg,#8a8471,#6d6858)}
.spine.lendo{background:linear-gradient(160deg,var(--accent2),var(--accent))}
.spine.lido{background:linear-gradient(160deg,var(--good),#3c5f47)}
.spine-add{flex:0 0 auto;width:72px;height:170px;border-radius:8px 10px 10px 8px;border:1.5px dashed var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink-soft);cursor:pointer;background:none}

.goal-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.goal-select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:500 13px/1 Inter,sans-serif;margin-bottom:10px}

/* Leitor com atmosfera por clima do livro */
.reader{display:none;flex-direction:column;gap:10px}
.reader.open{display:flex}
.reader-stage{border-radius:22px;padding:18px;transition:background .4s ease}
.reader-stage .flourish{font-size:22px;margin-bottom:8px;opacity:.85}
.reader-stage .book-title{font:600 17px/1.3 Newsreader,Georgia,serif;color:#fff;margin:0 0 2px}
.reader-stage .book-mood{font:700 9.5px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);margin:0 0 12px}
.reader-canvas-wrap{background:#fff;border-radius:14px;overflow:auto;max-height:56vh;display:flex;justify-content:center;padding:8px}
.reader-canvas-wrap canvas{max-width:100%}
.reader-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.reader-nav button{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:10px;padding:8px 14px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer}
.reader-nav .pageinfo{color:#fff;font:600 12px/1 Inter,sans-serif}
.reader-voice-row{display:flex;gap:10px;align-items:center;margin-top:12px}
.reader-voice-row button{background:none;border:none;color:#fff;font:600 12.5px/1 Inter,sans-serif;cursor:pointer}

[data-mood="aventura"]{background:linear-gradient(150deg,#7a3a12,#c9793f)}
[data-mood="misterio"]{background:linear-gradient(150deg,#161125,#3a2f57)}
[data-mood="romance"]{background:linear-gradient(150deg,#5c1f2e,#a6435f)}
[data-mood="filosofia"]{background:linear-gradient(150deg,#1c2b33,#3f6373)}
[data-mood="drama"]{background:linear-gradient(150deg,#2b0f0f,#7a2222)}
[data-mood="comedia"]{background:linear-gradient(150deg,#7a5a00,#d1a52a)}
[data-mood="terror"]{background:linear-gradient(150deg,#0a0a0c,#3a1414)}
[data-mood="biografia"]{background:linear-gradient(150deg,#3a2f22,#8a7550)}

/* Leitor estilo Speechify: texto da página com destaque palavra a palavra */
.speech{margin-top:12px;background:rgba(0,0,0,.28);border-radius:14px;padding:14px;max-height:34vh;overflow-y:auto}
.speech p{margin:0;font:400 15px/1.85 var(--font-serif);color:rgba(255,255,255,.72)}
.speech w{border-radius:4px;padding:1px 2px;transition:background .1s,color .1s}
.speech w.on{background:var(--gold);color:#141000;font-weight:600}
.speech w.lido{color:rgba(255,255,255,.95)}
.speech-bar{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.speech-bar button{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:9px;padding:8px 13px;font:600 12px/1 var(--font-sans);cursor:pointer}
.speech-bar button.play{background:var(--gold);color:#141000;font-weight:700}
.speech-bar select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:11.5px;padding:7px 9px;border-radius:9px}
.speech-bar .spd{display:flex;gap:4px}
.speech-bar .spd b{
  font:700 11px/1 var(--font-mono);color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);
  border-radius:7px;padding:7px 8px;cursor:pointer;
}
.speech-bar .spd b.on{background:var(--gold);color:#141000}

.sugestoes-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.sugestao-item{padding:10px 0;border-bottom:1px solid var(--line);font:400 13px/1.5 Inter,sans-serif}
.sugestao-item:last-child{border-bottom:none}
.sugestao-item b{color:var(--accent2)}

.add-form{display:flex;flex-direction:column;gap:8px}
.add-form input,.add-form select{font:500 13px/1 Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.add-form-row{display:flex;gap:8px}
.add-form-row>*{flex:1}
.status-msg{font:400 12px/1.4 Inter,sans-serif;color:var(--ink-soft);margin:6px 0 0}
</style>
</head>
<body>

<div class="brgx-head">
  <a class="brgx-back" href="../index.html">← MEU</a>
  <p class="brgx-eyebrow">MEU.app/biblioteca · pessoal</p>
  <h1>Biblioteca</h1>
  <p>Sua lista de livros, o leitor de PDF, e a atmosfera de cada leitura.</p>
</div>

<div class="brgx-shell">

  <div>
    <p class="section-label" style="margin-bottom:8px">Estante</p>
    <div class="shelf-scroll" id="shelf"></div>
  </div>

  <div class="reader" id="reader">
    <div class="reader-stage" id="readerStage" data-mood="filosofia">
      <p class="flourish">📖</p>
      <p class="book-title" id="readerTitle"></p>
      <p class="book-mood" id="readerMood"></p>
      <div class="reader-voice-row" style="margin:0 0 10px">
        <select id="readerStatus" style="border-radius:8px;border:none;padding:6px 8px;font:600 11.5px/1 Inter,sans-serif">
          <option value="quero">Quero ler</option>
          <option value="lendo">Lendo</option>
          <option value="lido">Lido</option>
        </select>
        <button type="button" id="readerEdit">✎ Editar</button>
        <button type="button" id="readerDelete">✕ Excluir</button>
      </div>
      <div class="reader-canvas-wrap"><canvas id="pdfCanvas"></canvas></div>
      <div class="reader-nav">
        <button id="prevPage">‹ anterior</button>
        <span class="pageinfo" id="pageInfo">—</span>
        <button id="nextPage">próxima ›</button>
      </div>
      <div class="speech" id="speech" style="display:none"><p id="speechTxt"></p></div>
      <div class="speech-bar" id="speechBar" style="display:none">
        <button class="play" id="ouvirBtn">▶ Chai lê pra mim</button>
        <span class="spd" id="spd"></span>
        <select id="vozSel"></select>
      </div>
      <div class="reader-voice-row">
        <button id="carregarTexto">📖 Abrir texto desta página</button>
        <button id="fecharReader">Fechar leitor</button>
      </div>
    </div>
  </div>

  <div class="goal-card">
    <p class="section-label" style="margin-bottom:10px">Meta de leitura</p>
    <select class="goal-select" id="goalSelect"></select>
    <div id="goalProgress"></div>
  </div>

  <div class="sugestoes-card">
    <p class="section-label" style="margin-bottom:8px">Sugestões do Chai</p>
    <div id="sugestoes"></div>
    <p class="status-msg">Toque na bolinha do Chai (canto inferior) pra pedir dicas de leitura personalizadas.</p>
  </div>

  <div class="card">
    <p class="section-label" style="margin-bottom:10px">Lançar livro</p>
    <form class="add-form" id="bookForm">
      <input type="text" id="bookTitulo" placeholder="Título" required />
      <div class="add-form-row">
        <input type="text" id="bookAutor" placeholder="Autor" />
        <select id="bookStatus">
          <option value="quero">Quero ler</option>
          <option value="lendo">Lendo</option>
          <option value="lido">Lido</option>
        </select>
      </div>
      <div class="add-form-row">
        <select id="bookMoodManual">
          <option value="aventura">Aventura</option>
          <option value="misterio">Mistério</option>
          <option value="romance">Romance</option>
          <option value="filosofia">Filosofia</option>
          <option value="drama">Drama</option>
          <option value="comedia">Comédia</option>
          <option value="terror">Terror</option>
          <option value="biografia">Biografia</option>
        </select>
        <input type="file" id="bookPdf" accept="application/pdf" />
      </div>
      <button type="submit" class="mini-btn solid" id="bookSubmitBtn">Lançar livro</button>
      <p class="status-msg" id="bookStatusMsg"></p>
    </form>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="../assets/brgx-shared.js"></script>
<script>
(function(){
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const MOOD_LABEL = {aventura:'Aventura', misterio:'Mistério', romance:'Romance', filosofia:'Filosofia', drama:'Drama', comedia:'Comédia', terror:'Terror', biografia:'Biografia'};

  function idbOpen(){
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open('brgx-biblioteca-db', 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore('pdfs'); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }
  async function idbPutPdf(id, blob){ const db = await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('pdfs','readwrite'); tx.objectStore('pdfs').put(blob,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
  async function idbGetPdf(id){ const db = await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('pdfs','readonly'); const r=tx.objectStore('pdfs').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  async function idbDeletePdf(id){ const db = await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('pdfs','readwrite'); tx.objectStore('pdfs').delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

  let livros = brgxStorageGet('brgx-biblioteca-livros', []);
  let goalId = brgxStorageGet('brgx-biblioteca-meta-vinculada', null);
  let sugestoes = brgxStorageGet('brgx-biblioteca-sugestoes', [
    {id:'s1', autor:'Regra geral', texto:'Best-sellers envelhecem mal — prefira o livro que resolveu um problema real de alguém a um que só vendeu muito.'},
  ]);

  function saveLivros(){ brgxStorageSet('brgx-biblioteca-livros', livros); }

  function renderShelf(){
    const el = document.getElementById('shelf');
    el.innerHTML = '';
    livros.forEach(l=>{
      const spine = document.createElement('div');
      spine.className = 'spine ' + l.status;
      spine.innerHTML = `<span class="status"></span><span class="titulo"></span>`;
      spine.querySelector('.status').textContent = l.status==='quero'?'Quero':(l.status==='lendo'?'Lendo':'Lido');
      spine.querySelector('.titulo').textContent = l.titulo;
      spine.addEventListener('click', ()=> openReader(l));
      el.appendChild(spine);
    });
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'spine-add';
    add.textContent = '+';
    add.addEventListener('click', ()=> document.getElementById('bookTitulo').focus());
    el.appendChild(add);
  }

  let pdfDoc = null, currentPage = 1, currentBook = null;

  function moodForProgress(book, pct){
    if (!book.atmosfera) return book.moodManual || 'filosofia';
    const changePoints = book.atmosfera.changePoints || [];
    const passed = changePoints.filter(c => pct >= c.atPercent).sort((a,b)=>b.atPercent-a.atPercent);
    return passed.length ? passed[0].mood : book.atmosfera.baseMood;
  }

  function marcarStatus(book, novoStatus){
    const eraLido = book.status === 'lido';
    book.status = novoStatus;
    if (!eraLido && novoStatus === 'lido' && !book.contadoNaMeta){
      book.contadoNaMeta = true;
      const goals = brgxStorageGet('brgx-metas-goals', []);
      const goal = goals.find(g=>g.id===goalId);
      if (goal){
        goal.valorAtual = (goal.valorAtual || 0) + 1;
        if (goal.valorAlvo) goal.pct = Math.min(100, Math.round(goal.valorAtual / goal.valorAlvo * 100));
        brgxStorageSet('brgx-metas-goals', goals);
        renderGoal();
      }
    }
    saveLivros();
    renderShelf();
  }

  document.getElementById('readerStatus').addEventListener('change', (e)=>{
    if (currentBook) marcarStatus(currentBook, e.target.value);
  });
  document.getElementById('readerEdit').addEventListener('click', ()=>{
    if (!currentBook) return;
    const novoTitulo = prompt('Título', currentBook.titulo);
    if (novoTitulo && novoTitulo.trim()){ currentBook.titulo = novoTitulo.trim(); saveLivros(); renderShelf(); document.getElementById('readerTitle').textContent = currentBook.titulo + (currentBook.autor ? ' — ' + currentBook.autor : ''); }
  });
  document.getElementById('readerDelete').addEventListener('click', async ()=>{
    if (!currentBook) return;
    const ok = await brgxConfirm({title:'Excluir livro', text:'Remove o livro, o PDF salvo e o progresso de leitura. Continuar?', confirmLabel:'Excluir'});
    if (!ok) return;
    await idbDeletePdf(currentBook.id).catch(()=>{});
    livros = livros.filter(l=>l.id!==currentBook.id);
    saveLivros();
    document.getElementById('reader').classList.remove('open');
    pdfDoc = null; currentBook = null;
    renderShelf();
  });

  async function openReader(book){
    currentBook = book;
    document.getElementById('reader').classList.add('open');
    document.getElementById('readerStatus').value = book.status;
    document.getElementById('readerTitle').textContent = book.titulo + (book.autor ? ' — ' + book.autor : '');
    const blob = await idbGetPdf(book.id).catch(()=>null);
    if (!blob){
      document.getElementById('pageInfo').textContent = 'Sem PDF salvo pra esse livro ainda.';
      document.getElementById('readerMood').textContent = MOOD_LABEL[book.moodManual || 'filosofia'];
      document.getElementById('readerStage').dataset.mood = book.moodManual || 'filosofia';
      return;
    }
    const buf = await blob.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    currentPage = book.paginaAtual || 1;
    await renderPage();
  }

  async function renderPage(){
    if (!pdfDoc) return;
    const page = await pdfDoc.getPage(currentPage);
    const viewport = page.getViewport({ scale: 1.1 });
    const canvas = document.getElementById('pdfCanvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    document.getElementById('pageInfo').textContent = currentPage + ' / ' + pdfDoc.numPages;
    const pct = Math.round(currentPage / pdfDoc.numPages * 100);
    const mood = moodForProgress(currentBook, pct);
    document.getElementById('readerStage').dataset.mood = mood;
    document.getElementById('readerMood').textContent = MOOD_LABEL[mood] || mood;
    currentBook.paginaAtual = currentPage;
    saveLivros();
  }

  document.getElementById('prevPage').addEventListener('click', ()=>{ if (pdfDoc && currentPage>1){ currentPage--; renderPage(); } });
  document.getElementById('nextPage').addEventListener('click', ()=>{ if (pdfDoc && currentPage<pdfDoc.numPages){ currentPage++; renderPage(); } });
  document.getElementById('fecharReader').addEventListener('click', ()=>{
    document.getElementById('reader').classList.remove('open');
    pdfDoc = null; currentBook = null;
    pararLeitura();
    document.getElementById('speech').style.display = 'none';
    document.getElementById('speechBar').style.display = 'none';
  });
  /* ---- Leitor estilo Speechify ----
     A Web Speech API emite onboundary a cada palavra falada; usamos esse evento
     para mover o destaque em sincronia com a voz. Sem chave paga, sem backend.
     (Trocar por uma API dedicada é isolado: só a função falarTexto muda.) */
  let palavras = [], utterAtual = null, lendo = false, velocidade = 1;

  function montarTexto(texto){
    const sp = document.getElementById('speechTxt');
    sp.innerHTML = '';
    palavras = [];
    let idx = 0;
    texto.split(/(\s+)/).forEach(tok=>{
      if (/^\s+$/.test(tok)){ sp.appendChild(document.createTextNode(tok)); idx += tok.length; return; }
      const w = document.createElement('w');
      w.textContent = tok;
      w.dataset.ini = idx;
      sp.appendChild(w);
      palavras.push({ el:w, ini:idx, fim:idx+tok.length });
      idx += tok.length;
    });
    document.getElementById('speech').style.display = 'block';
    document.getElementById('speechBar').style.display = 'flex';
  }

  function destacar(charIndex){
    let alvo = null;
    for (const p of palavras){
      if (charIndex >= p.ini && charIndex < p.fim){ alvo = p; break; }
    }
    palavras.forEach(p=>{
      p.el.classList.toggle('on', p === alvo);
      if (alvo && p.fim <= alvo.ini) p.el.classList.add('lido');
    });
    if (alvo) alvo.el.scrollIntoView({ block:'center', behavior:'smooth' });
  }

  function pararLeitura(){
    window.speechSynthesis.cancel();
    lendo = false;
    document.getElementById('ouvirBtn').textContent = '▶ Chai lê pra mim';
    palavras.forEach(p=>p.el.classList.remove('on'));
  }

  function falarTexto(texto){
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = velocidade;
    u.pitch = 0.75;
    const voz = brgxPegarVoz('brgx-voz-chai');
    if (voz) u.voice = voz;
    u.onboundary = (e)=>{ if (e.name === 'word' || e.charIndex != null) destacar(e.charIndex); };
    u.onend = ()=>{
      pararLeitura();
      // Continua no fluxo: avança de página sozinho, como num audiobook.
      if (pdfDoc && currentPage < pdfDoc.numPages){
        currentPage++; renderPage().then(()=>carregarTextoDaPagina(true));
      }
    };
    utterAtual = u;
    lendo = true;
    document.getElementById('ouvirBtn').textContent = '⏸ Pausar';
    window.speechSynthesis.speak(u);
  }

  async function carregarTextoDaPagina(autoPlay){
    if (!pdfDoc) return;
    const page = await pdfDoc.getPage(currentPage);
    const content = await page.getTextContent();
    const texto = content.items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim().slice(0, 4000);
    if (!texto){
      document.getElementById('speechTxt').textContent = 'Esta página não tem texto extraível (provavelmente é uma imagem escaneada).';
      document.getElementById('speech').style.display = 'block';
      return;
    }
    montarTexto(texto);
    if (autoPlay) falarTexto(texto);
    return texto;
  }

  document.getElementById('carregarTexto').addEventListener('click', ()=> carregarTextoDaPagina(false));

  document.getElementById('ouvirBtn').addEventListener('click', async ()=>{
    if (lendo){ pararLeitura(); return; }
    const txt = document.getElementById('speechTxt').textContent.trim() || await carregarTextoDaPagina(false);
    if (txt) falarTexto(txt);
  });

  function renderVelocidade(){
    const el = document.getElementById('spd');
    el.innerHTML = '';
    [0.8, 1, 1.25, 1.5, 2].forEach(v=>{
      const b = document.createElement('b');
      b.textContent = v + 'x';
      b.className = (v === velocidade) ? 'on' : '';
      b.addEventListener('click', ()=>{
        velocidade = v; renderVelocidade();
        if (lendo){ const t = document.getElementById('speechTxt').textContent; pararLeitura(); falarTexto(t); }
      });
      el.appendChild(b);
    });
  }

  function renderVozes(){
    const sel = document.getElementById('vozSel');
    const vozes = brgxCarregarVozesPTBR();
    const salva = localStorage.getItem('brgx-voz-chai');
    sel.innerHTML = vozes.length ? '' : '<option>sem voz pt-BR</option>';
    vozes.forEach(v=>{
      const o = document.createElement('option');
      o.value = v.name; o.textContent = v.name;
      if (v.name === salva) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', ()=> localStorage.setItem('brgx-voz-chai', sel.value));
  }
  renderVelocidade();
  setTimeout(renderVozes, 600);

  function renderGoal(){
    const goals = brgxStorageGet('brgx-metas-goals', []);
    const sel = document.getElementById('goalSelect');
    sel.innerHTML = '<option value="">— nenhuma meta linkada —</option>';
    goals.forEach(g=>{
      const opt = document.createElement('option');
      opt.value = g.id; opt.textContent = g.title;
      if (g.id === goalId) opt.selected = true;
      sel.appendChild(opt);
    });
    const box = document.getElementById('goalProgress');
    const goal = goals.find(g=>g.id===goalId);
    if (!goal){ box.innerHTML = '<p class="status-msg">Escolha uma meta pra contar livros lidos automaticamente.</p>'; return; }
    const alvo = goal.valorAlvo || 0;
    const atual = goal.valorAtual || 0;
    box.innerHTML = `
      <div class="bar-row">
        <div class="bar"><span style="width:${alvo ? Math.min(100, atual/alvo*100) : 0}%"></span></div>
        <span class="bar-pct">${alvo ? Math.round(atual/alvo*100) : 0}%</span>
      </div>
      <p class="status-msg">${atual} de ${alvo || '—'} livros</p>`;
  }
  document.getElementById('goalSelect').addEventListener('change', (e)=>{
    goalId = e.target.value || null;
    brgxStorageSet('brgx-biblioteca-meta-vinculada', goalId);
    renderGoal();
  });

  function renderSugestoes(){
    const el = document.getElementById('sugestoes');
    el.innerHTML = '';
    sugestoes.forEach(s=>{
      const div = document.createElement('div');
      div.className = 'sugestao-item';
      div.innerHTML = `<b></b> `;
      div.querySelector('b').textContent = s.autor + ':';
      div.append(' ' + s.texto);
      el.appendChild(div);
    });
  }

  async function extractSample(pdfDoc){
    const maxPages = Math.min(pdfDoc.numPages, 20);
    let text = '';
    for (let i=1; i<=maxPages && text.length < 12000; i++){
      const page = await pdfDoc.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(' ') + '\n';
    }
    return text.slice(0, 12000);
  }

  document.getElementById('bookForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const titulo = document.getElementById('bookTitulo').value.trim();
    const autor = document.getElementById('bookAutor').value.trim();
    const status = document.getElementById('bookStatus').value;
    const moodManual = document.getElementById('bookMoodManual').value;
    const file = document.getElementById('bookPdf').files[0];
    if (!titulo) return;

    const book = { id:'b'+Date.now(), titulo, autor, status, moodManual, atmosfera:null, paginaAtual:1 };
    const msgEl = document.getElementById('bookStatusMsg');

    if (file){
      msgEl.textContent = 'Salvando PDF…';
      await idbPutPdf(book.id, file);

      if (FUNCTIONS_BASE_URL){
        try {
          msgEl.textContent = 'Analisando atmosfera do livro (Chai)…';
          const buf = await file.arrayBuffer();
          const doc = await pdfjsLib.getDocument({ data: buf }).promise;
          const sample = await extractSample(doc);
          const res = await fetch(FUNCTIONS_BASE_URL + '/analyzeBookAtmosphere', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ title: titulo, textSample: sample }),
          });
          if (res.ok){
            const data = await res.json();
            book.atmosfera = data;
            msgEl.textContent = 'Atmosfera definida: ' + (MOOD_LABEL[data.baseMood] || data.baseMood) + '.';
          } else {
            msgEl.textContent = 'Não consegui analisar agora — usando o clima manual.';
          }
        } catch (err) {
          msgEl.textContent = 'Não consegui analisar agora — usando o clima manual.';
        }
      } else {
        msgEl.textContent = 'Backend ainda não configurado — usando o clima manual (veja functions/README.md).';
      }
    }

    livros.push(book);
    saveLivros();
    e.target.reset();
    renderShelf();
  });

  renderShelf();
  renderGoal();
  renderSugestoes();
})();
</script>
<script src="../assets/brgx-specialist.js"></script>
<script>brgxInitSpecialist('chai');</script>
</body>
