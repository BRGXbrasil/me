<!doctype html>
<html lang="pt-BR" data-brgx-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#efece5" />
<title>MEU · Dashboard</title>
<link rel="stylesheet" href="../assets/brgx-tokens.css" />
<style>
/* Bento grid / torre de controle — o mais denso e ambicioso dos 8, um tile vivo por app */
body{padding-bottom:40px}
.brgx-shell{max-width:640px}

.hero-wide{grid-column:1 / -1;background:linear-gradient(150deg,var(--hero-dark) 0%,var(--accent) 100%);border-radius:24px;padding:22px 20px;color:#fff;display:flex;align-items:center;gap:16px}
.hero-wide .eyebrow{font:700 10px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);margin:0 0 6px}
.hero-wide h2{margin:0;font:600 18px/1.3 Newsreader,Georgia,serif}
.hero-wide p{margin:4px 0 0;font:400 13px/1.4 Inter,sans-serif;color:rgba(255,255,255,.85)}

/* Grid de 2 colunas já no mobile — o bento nunca colapsa pra lista única.
   .wide destaca um tile ocupando a linha inteira, criando a assimetria. */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bento-tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-card);cursor:pointer;min-height:104px}
.bento-tile:hover{border-color:var(--accent)}
.bento-tile.wide{grid-column:1 / -1}
.bento-tile .app{font:700 9.5px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.bento-tile .val{font:600 18px/1.2 Newsreader,Georgia,serif;color:var(--ink)}
.bento-tile .val.small{font:600 13.5px/1.35 Inter,sans-serif}
.bento-tile .sub{font:400 11.5px/1.4 Inter,sans-serif;color:var(--ink-soft)}
.bento-tile .quick{align-self:flex-start;margin-top:auto;font:700 10.5px/1 Inter,sans-serif;color:var(--accent);background:var(--accent-soft);border:none;border-radius:999px;padding:6px 10px;cursor:pointer}

@media (min-width:560px){
  .bento{grid-template-columns:repeat(4,1fr)}
  .bento-tile.wide{grid-column:span 2}
}

.quick-row{display:flex;gap:8px;overflow-x:auto}
.quick-row a{flex:0 0 auto;font:700 11.5px/1 Inter,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
</style>
</head>
<body>

<div class="brgx-head">
  <a class="brgx-back" href="../index.html">← MEU</a>
  <p class="brgx-eyebrow">MEU.app/dashboard · pessoal</p>
  <h1>Dashboard</h1>
  <p>Uma leitura viva de todos os módulos — Caixa, Pet, Estilo, Reeducação, Oráculo, Recamier, Metas e Rotina.</p>
</div>

<div class="brgx-shell">

  <div class="bento" id="bento"></div>

  <div>
    <p class="section-label" style="margin-bottom:8px">Ações rápidas</p>
    <div class="quick-row">
      <a href="BRGX Caixa.html">Lançar gasto</a>
      <a href="BRGX Rotina.html">Marcar hábito</a>
      <a href="BRGX Reeducacao.html">Registrar refeição</a>
      <a href="BRGX Pet.html">Registrar cuidado</a>
    </div>
  </div>

</div>

<script src="../assets/brgx-shared.js"></script>
<script>
(function(){
  const todayKey = ()=> new Date().toISOString().slice(0,10);
  const fmtMoney = (v)=> new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);

  function caixaTile(){
    const tx = brgxStorageGet('brgx_caixa_data', []);
    const key = todayKey();
    const todayTx = tx.filter(t => (t.data||'').slice(0,10) === key);
    const saldo = todayTx.reduce((s,t)=> s + (t.tipo==='entrada' ? t.valor : -t.valor), 0);
    return {app:'Caixa', val: fmtMoney(saldo), sub:`${todayTx.length} lançamento(s) hoje`, href:'BRGX Caixa.html', size:''};
  }

  function petTile(){
    const care = brgxStorageGet('brgx-pet-care', []);
    const log = brgxStorageGet('brgx-pet-care-log', {});
    const todayLog = log[todayKey()] || {};
    const pending = care.find(c => !todayLog[c.id]);
    return {app:'Pet · Júnior', val: pending ? pending.name : 'Tudo feito', small:true, sub: pending ? `${pending.time} · próximo cuidado` : 'Nenhum cuidado pendente hoje', href:'BRGX Pet.html', size:''};
  }

  function estiloTile(){
    const refs = brgxStorageGet('brgx-estilo-refs', []);
    const last = refs[refs.length-1];
    return {app:'Estilo', val: last ? last.note : 'Sem referências', small:true, sub: last ? (last.tag||'referência salva') : 'Salve sua primeira referência', href:'BRGX Estilo.html', size:'wide'};
  }

  function reeducacaoTile(){
    const hydration = brgxStorageGet('brgx-reeducacao-hydration', {});
    const meals = brgxStorageGet('brgx-reeducacao-meals', []);
    const key = todayKey();
    const water = hydration[key] || 0;
    const mealsToday = meals.filter(m=>m.date===key).length;
    return {app:'Reeducação', val: `${mealsToday}/3 refeições`, small:true, sub:`${water}/8 copos d'água hoje`, href:'BRGX Reeducacao.html', size:''};
  }

  function oracleTile(){
    const readings = brgxStorageGet('brgx-oracle-readings', []);
    const today = readings.find(r=>r.date===todayKey());
    return {app:'Oráculo', val: today ? 'Leitura aberta' : 'Sem leitura hoje', small:true, sub: today ? (today.reflected?'Já refletida':'Ainda não refletida') : 'Toque para gerar', href:'BRGX Oracle.html', size:''};
  }

  function recamierTile(){
    const agenda = brgxStorageGet('brgx-recamier-agenda', []);
    const next = [...agenda].sort((a,b)=>(a.when||'').localeCompare(b.when||''))[0];
    return {app:'Recamier', val: next ? next.when : 'Nada agendado', small:true, sub: next ? next.note : 'Agende a próxima sessão', href:'BRGX Recamier.html', size:''};
  }

  function metasTile(){
    const goals = brgxStorageGet('brgx-metas-goals', []);
    const focus = goals[0];
    return {app:'Metas', val: focus ? `${focus.pct}%` : '—', sub: focus ? focus.title : 'Nenhuma meta lançada', href:'BRGX Metas.html', size:'wide'};
  }

  function rotinaTile(){
    const habits = brgxStorageGet('brgx-rotina-habits', []);
    const log = brgxStorageGet('brgx-rotina-log', {});
    const todayLog = log[todayKey()] || {};
    const total = habits.length || 1;
    const done = Object.values(todayLog).filter(Boolean).length;
    const score = Math.round(100*done/total);
    return {app:'Rotina', val: `${score}`, sub:`${done}/${habits.length} hábitos hoje`, href:'BRGX Rotina.html', size:''};
  }

  function render(){
    const tiles = [caixaTile(), petTile(), estiloTile(), reeducacaoTile(), oracleTile(), recamierTile(), metasTile(), rotinaTile()];
    const el = document.getElementById('bento');
    el.innerHTML = '';
    tiles.forEach(t=>{
      const div = document.createElement('div');
      div.className = 'bento-tile ' + t.size;
      div.innerHTML = `
        <span class="app"></span>
        <span class="val ${t.small?'small':''}"></span>
        <span class="sub"></span>`;
      div.querySelector('.app').textContent = t.app;
      div.querySelector('.val').textContent = t.val;
      div.querySelector('.sub').textContent = t.sub;
      div.addEventListener('click', ()=> window.location.href = t.href);
      el.appendChild(div);
    });
  }

  render();
})();
</script>
</body>
</html>
