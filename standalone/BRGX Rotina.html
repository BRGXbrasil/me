<!doctype html>
<html lang="pt-BR" data-brgx-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#efece5" />
<title>MEU · Rotina</title>
<link rel="stylesheet" href="../assets/brgx-tokens.css" />
<style>
body{padding-bottom:40px}

/* Grade horária do dia — lista vertical com trilho de hora à esquerda */
.day-grid{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.day-slot{position:relative;padding:0 0 16px 20px}
.day-slot::before{content:'';position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:999px;background:var(--card);border:2px solid var(--track)}
.day-slot.done::before{background:var(--good);border-color:var(--good)}
.day-time{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 4px}
.slot-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.slot-row.done{background:var(--good-soft);border-color:transparent}
.slot-check{width:22px;height:22px;border-radius:999px;border:2px solid var(--track);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:var(--card)}
.slot-row.done .slot-check{background:var(--good);border-color:var(--good)}
.slot-body{flex:1;min-width:0}
.slot-name{font:600 13.5px/1.3 Inter,sans-serif;color:var(--ink)}
.slot-cat{font:500 11px/1.3 Inter,sans-serif;color:var(--ink-soft)}
.slot-actions{display:flex;gap:4px;flex:0 0 auto}
.slot-actions button{background:none;border:none;color:var(--ink-soft);font-size:13px;cursor:pointer;padding:4px}
.slot-actions button.danger{color:var(--danger)}

/* Heatmap semanal */
.heatmap{display:flex;gap:6px;justify-content:space-between}
.heat-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.heat-sq{width:100%;aspect-ratio:1;border-radius:8px;background:var(--track)}
.heat-label{font:700 9.5px/1 Inter,sans-serif;color:var(--ink-soft);text-transform:uppercase}

/* Filtros de categoria */
.cat-filters{display:flex;flex-wrap:wrap;gap:6px}
.cat-filters .pill{cursor:pointer;border:1px solid transparent}
.cat-filters .pill.active{background:var(--accent);color:#fff}

/* Modo Reset — affordance desativado, prepara o encaixe futuro */
.reset-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--track);border:1px dashed var(--ink-soft);opacity:.8}
.reset-toggle-copy{font:600 12.5px/1.4 Inter,sans-serif;color:var(--ink-soft)}
.reset-toggle button{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 12px;cursor:not-allowed}

.add-form{display:flex;flex-direction:column;gap:8px}
.add-form input,.add-form select{font:500 13px/1 Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.add-form-row{display:flex;gap:8px}
.add-form-row>*{flex:1}
</style>
</head>
<body>

<div class="brgx-head">
  <a class="brgx-back" href="../index.html">← MEU</a>
  <p class="brgx-eyebrow">MEU.app/rotina · pessoal</p>
  <h1>Rotina</h1>
  <p>Grade do dia por horário e visão semanal em heatmap. Marcar, editar ou excluir hábitos.</p>
</div>

<div class="brgx-shell">

  <div class="card">
    <p class="section-label">Semana</p>
    <div class="heatmap" id="heatmap" style="margin-top:10px"></div>
  </div>

  <div class="reset-toggle">
    <span class="reset-toggle-copy">Modo Reset (detox 90 dias) — em breve, acoplado aqui</span>
    <button type="button" disabled>Ativar</button>
  </div>

  <div class="cat-filters" id="catFilters"></div>

  <div>
    <p class="section-label" style="margin-bottom:8px">Hoje</p>
    <div class="day-grid" id="dayGrid"></div>
  </div>

  <div class="card">
    <p class="section-label" style="margin-bottom:10px">Lançar novo hábito</p>
    <form class="add-form" id="addForm">
      <input type="text" id="habitName" placeholder="Nome do hábito" required />
      <div class="add-form-row">
        <select id="habitCat">
          <option value="ritual">Ritual</option>
          <option value="mente">Mente</option>
          <option value="corpo">Corpo</option>
          <option value="criacao">Criação</option>
          <option value="trabalho">Trabalho</option>
          <option value="vinculo">Vínculo</option>
        </select>
        <input type="time" id="habitTime" value="08:00" />
      </div>
      <button type="submit" class="mini-btn solid">Lançar hábito</button>
    </form>
  </div>

</div>

<script src="../assets/brgx-shared.js"></script>
<script>
(function(){
  const CAT_LABEL = {ritual:'Ritual',mente:'Mente',corpo:'Corpo',criacao:'Criação',trabalho:'Trabalho',vinculo:'Vínculo'};
  const todayKey = (d=new Date()) => d.toISOString().slice(0,10);

  let habits = brgxStorageGet('brgx-rotina-habits', [
    {id:'h1', name:'Água com limão', cat:'ritual', time:'07:00'},
    {id:'h2', name:'Treino / alongamento', cat:'corpo', time:'08:00'},
    {id:'h3', name:'Meditação', cat:'mente', time:'21:30'}
  ]);
  let log = brgxStorageGet('brgx-rotina-log', {});
  let activeCat = 'all';

  function save(){
    brgxStorageSet('brgx-rotina-habits', habits);
    brgxStorageSet('brgx-rotina-log', log);
  }

  function dayLog(key){ return log[key] || (log[key]={}); }

  function renderFilters(){
    const cats = ['all', ...new Set(habits.map(h=>h.cat))];
    const el = document.getElementById('catFilters');
    el.innerHTML = '';
    cats.forEach(c=>{
      const p = document.createElement('span');
      p.className = 'pill' + (c===activeCat ? ' active' : '');
      p.textContent = c==='all' ? 'Todas' : CAT_LABEL[c] || c;
      p.addEventListener('click', ()=>{ activeCat=c; renderFilters(); renderGrid(); });
      el.appendChild(p);
    });
  }

  function renderGrid(){
    const key = todayKey();
    const todayLog = dayLog(key);
    const grid = document.getElementById('dayGrid');
    grid.innerHTML = '';
    const list = habits.filter(h => activeCat==='all' || h.cat===activeCat)
      .sort((a,b)=> (a.time||'').localeCompare(b.time||''));

    if(list.length===0){
      grid.innerHTML = '<p style="color:var(--ink-soft);font-size:13px;padding-left:8px">Nenhum hábito nessa categoria ainda.</p>';
      return;
    }

    list.forEach(h=>{
      const done = !!todayLog[h.id];
      const slot = document.createElement('div');
      slot.className = 'day-slot' + (done?' done':'');
      slot.innerHTML = `
        <p class="day-time">${h.time || '--:--'}</p>
        <div class="slot-row ${done?'done':''}">
          <button class="slot-check" data-id="${h.id}">${done?'✓':''}</button>
          <div class="slot-body">
            <p class="slot-name"></p>
            <p class="slot-cat">${CAT_LABEL[h.cat]||h.cat}</p>
          </div>
          <div class="slot-actions">
            <button data-act="edit" data-id="${h.id}" title="Editar">✎</button>
            <button data-act="del" data-id="${h.id}" class="danger" title="Excluir">✕</button>
          </div>
        </div>`;
      slot.querySelector('.slot-name').textContent = h.name;
      grid.appendChild(slot);
    });

    grid.querySelectorAll('.slot-check').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.id;
        todayLog[id] = !todayLog[id];
        save();
        renderGrid();
        renderHeatmap();
      });
    });
    grid.querySelectorAll('[data-act="del"]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = await brgxConfirm({title:'Excluir hábito', text:'Isso remove o hábito e seu histórico de marcações futuras. Continuar?', confirmLabel:'Excluir'});
        if(!ok) return;
        habits = habits.filter(h=>h.id!==btn.dataset.id);
        save(); renderFilters(); renderGrid();
      });
    });
    grid.querySelectorAll('[data-act="edit"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const h = habits.find(x=>x.id===btn.dataset.id);
        const novo = prompt('Novo nome do hábito', h.name);
        if(novo && novo.trim()){ h.name = novo.trim(); save(); renderGrid(); }
      });
    });
  }

  function renderHeatmap(){
    const el = document.getElementById('heatmap');
    el.innerHTML = '';
    const DIAS = ['D','S','T','Q','Q','S','S'];
    for(let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const key = todayKey(d);
      const dl = log[key] || {};
      const total = habits.length || 1;
      const doneCount = Object.values(dl).filter(Boolean).length;
      const pct = doneCount/total;
      const col = document.createElement('div');
      col.className = 'heat-day';
      const sq = document.createElement('div');
      sq.className = 'heat-sq';
      sq.style.background = pct===0 ? 'var(--track)' : `color-mix(in srgb, var(--good) ${Math.round(pct*100)}%, var(--track))`;
      col.appendChild(sq);
      const lbl = document.createElement('span');
      lbl.className = 'heat-label';
      lbl.textContent = DIAS[d.getDay()];
      col.appendChild(lbl);
      el.appendChild(col);
    }
  }

  document.getElementById('addForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const name = document.getElementById('habitName').value.trim();
    const cat = document.getElementById('habitCat').value;
    const time = document.getElementById('habitTime').value;
    if(!name) return;
    habits.push({id:'h'+Date.now(), name, cat, time});
    save();
    document.getElementById('habitName').value='';
    renderFilters(); renderGrid(); renderHeatmap();
  });

  renderFilters();
  renderGrid();
  renderHeatmap();
})();
</script>
</body>
</html>
