<!doctype html>
<html lang="pt-BR" data-brgx-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#efece5" />
<title>MEU · Metas</title>
<link rel="stylesheet" href="../assets/brgx-tokens.css" />
<style>
body{padding-bottom:40px}

/* Trilha vertical em zig-zag */
.trail{position:relative;padding:8px 0}
.trail::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-50%)}
.trail-goal{position:relative;display:flex;margin-bottom:28px}
.trail-goal:nth-child(odd){justify-content:flex-start}
.trail-goal:nth-child(even){justify-content:flex-end}
.trail-card{width:calc(50% - 26px);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow-card)}
.trail-ring{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:40px;height:40px;border-radius:999px;background:var(--card);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font:800 12px/1 Newsreader,serif;color:var(--accent);z-index:2}
.trail-title{margin:0 0 4px;font:600 14.5px/1.3 Newsreader,Georgia,serif;color:var(--ink)}
.trail-deadline{margin:0 0 10px;font:600 10px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.checks{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.check-row{display:flex;align-items:center;gap:8px;font:500 12px/1.4 Inter,sans-serif}
.check-dot{width:14px;height:14px;border-radius:999px;border:2px solid var(--track);flex:0 0 auto;cursor:pointer}
.check-dot.done{background:var(--good);border-color:var(--good)}
.check-row.done{color:var(--ink-soft);text-decoration:line-through}
.trail-actions{display:flex;gap:6px;margin-top:8px}
.trail-actions button{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer}
.trail-actions button.danger{color:var(--danger)}

@media (max-width:520px){
  .trail::before{left:20px}
  .trail-ring{left:20px}
  .trail-goal,.trail-goal:nth-child(even){justify-content:flex-end}
  .trail-card{width:calc(100% - 56px)}
}

.add-form{display:flex;flex-direction:column;gap:8px}
.add-form input{font:500 13px/1 Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
</style>
</head>
<body>

<div class="brgx-head">
  <a class="brgx-back" href="../index.html">← MEU</a>
  <p class="brgx-eyebrow">MEU.app/metas · pessoal</p>
  <h1>Metas</h1>
  <p>Trilha do ano: metas com anel de progresso e checkpoints trimestrais pendurados no caminho.</p>
</div>

<div class="brgx-shell">
  <div class="trail" id="trail"></div>

  <div class="card">
    <p class="section-label" style="margin-bottom:10px">Lançar nova meta</p>
    <form class="add-form" id="addForm">
      <input type="text" id="goalTitle" placeholder="Título da meta" required />
      <input type="text" id="goalDeadline" placeholder="Prazo (ex: Q4 2026)" />
      <button type="submit" class="mini-btn solid">Lançar meta</button>
    </form>
  </div>
</div>

<script src="../assets/brgx-shared.js"></script>
<script>
(function(){
  let goals = brgxStorageGet('brgx-metas-goals', [
    {id:'g1', title:'Expansão — nova unidade', deadline:'Dez 2026', pct:30},
    {id:'g2', title:'Reserva de emergência 6 meses', deadline:'Jun 2026', pct:55}
  ]);
  let checks = brgxStorageGet('brgx-metas-checks', [
    {id:'c1', goalId:'g1', label:'Ponto fechado', done:true},
    {id:'c2', goalId:'g1', label:'Reforma concluída', done:false},
    {id:'c3', goalId:'g1', label:'Equipe contratada', done:false},
    {id:'c4', goalId:'g2', label:'Aporte mensal automático', done:true},
    {id:'c5', goalId:'g2', label:'Meta de 50% atingida', done:true}
  ]);

  function save(){
    brgxStorageSet('brgx-metas-goals', goals);
    brgxStorageSet('brgx-metas-checks', checks);
  }

  function recalcPct(goalId){
    const gc = checks.filter(c=>c.goalId===goalId);
    if(gc.length===0) return;
    const goal = goals.find(g=>g.id===goalId);
    goal.pct = Math.round(100 * gc.filter(c=>c.done).length / gc.length);
  }

  function render(){
    const el = document.getElementById('trail');
    el.innerHTML = '';
    goals.forEach(g=>{
      const gc = checks.filter(c=>c.goalId===g.id);
      const row = document.createElement('div');
      row.className = 'trail-goal';
      row.innerHTML = `
        <div class="trail-ring">${g.pct}%</div>
        <div class="trail-card">
          <p class="trail-deadline"></p>
          <p class="trail-title"></p>
          <div class="checks"></div>
          <div class="trail-actions">
            <button data-act="add-check" data-id="${g.id}">+ checkpoint</button>
            <button data-act="edit" data-id="${g.id}">editar</button>
            <button data-act="del" data-id="${g.id}" class="danger">excluir</button>
          </div>
        </div>`;
      row.querySelector('.trail-deadline').textContent = g.deadline || 'sem prazo';
      row.querySelector('.trail-title').textContent = g.title;
      const checksEl = row.querySelector('.checks');
      gc.forEach(c=>{
        const cr = document.createElement('div');
        cr.className = 'check-row' + (c.done?' done':'');
        cr.innerHTML = `<span class="check-dot ${c.done?'done':''}" data-id="${c.id}"></span><span></span>`;
        cr.querySelector('span:last-child').textContent = c.label;
        checksEl.appendChild(cr);
      });
      el.appendChild(row);
    });

    el.querySelectorAll('.check-dot').forEach(dot=>{
      dot.addEventListener('click', ()=>{
        const c = checks.find(x=>x.id===dot.dataset.id);
        c.done = !c.done;
        recalcPct(c.goalId);
        save(); render();
      });
    });
    el.querySelectorAll('[data-act="add-check"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const label = prompt('Nome do checkpoint');
        if(!label || !label.trim()) return;
        checks.push({id:'c'+Date.now(), goalId:btn.dataset.id, label:label.trim(), done:false});
        recalcPct(btn.dataset.id);
        save(); render();
      });
    });
    el.querySelectorAll('[data-act="edit"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const g = goals.find(x=>x.id===btn.dataset.id);
        const novo = prompt('Novo título da meta', g.title);
        if(novo && novo.trim()){ g.title = novo.trim(); save(); render(); }
      });
    });
    el.querySelectorAll('[data-act="del"]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = await brgxConfirm({title:'Excluir meta', text:'A meta e seus checkpoints serão removidos. Continuar?', confirmLabel:'Excluir'});
        if(!ok) return;
        goals = goals.filter(g=>g.id!==btn.dataset.id);
        checks = checks.filter(c=>c.goalId!==btn.dataset.id);
        save(); render();
      });
    });
  }

  document.getElementById('addForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const title = document.getElementById('goalTitle').value.trim();
    const deadline = document.getElementById('goalDeadline').value.trim();
    if(!title) return;
    goals.push({id:'g'+Date.now(), title, deadline, pct:0});
    save();
    document.getElementById('goalTitle').value='';
    document.getElementById('goalDeadline').value='';
    render();
  });

  render();
})();
</script>
</body>
</html>
