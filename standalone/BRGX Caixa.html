<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#08080A" />
<title>MEU · Caixa</title>
<link rel="stylesheet" href="../assets/brgx-tokens.css" />
<style>
/* Carteira pessoal — cartões tipo "talão" pros dois ciclos, envelopes pro 50/30/20.
   De propósito bem diferente da grade/timeline dos outros apps: aqui é papelada de verdade. */
body{padding-bottom:40px}

.wallet-hero{background:linear-gradient(150deg,var(--hero-dark) 0%,var(--accent) 100%);border-radius:24px;padding:22px 20px;color:#fff;display:flex;gap:18px}
.wallet-hero .col{flex:1}
.wallet-hero .lbl{font:700 10px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);margin:0 0 6px}
.wallet-hero .val{font:700 24px/1.1 Newsreader,Georgia,serif;margin:0}
.wallet-hero .val.small{font-size:17px}

.pend-card{background:var(--track);border:1px dashed var(--danger);border-radius:16px;padding:14px 16px}
.pend-title{margin:0 0 8px;font:700 12px/1.3 Inter,sans-serif;color:var(--danger)}
.pend-row{display:flex;align-items:center;gap:10px;padding:6px 0;font:500 13px/1.4 Inter,sans-serif}
.pend-row input[type="date"]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:500 12.5px/1 Inter,sans-serif;background:var(--card)}

/* Cartões-talão dos ciclos */
.ticket{position:relative;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-card)}
.ticket-head{background:var(--accent);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:baseline}
.ticket-head .day{font:700 20px/1 Newsreader,Georgia,serif}
.ticket-head .renda{font:600 13px/1 Inter,sans-serif}
.ticket-perf{height:0;border-top:2px dashed var(--line);margin:0 18px}
.ticket-body{padding:14px 18px}
.ticket-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ticket-row:last-of-type{border-bottom:none}
.ticket-row .prazo-dot{width:8px;height:8px;border-radius:999px;flex:0 0 auto}
.ticket-row .prazo-dot.curto{background:var(--accent2)}
.ticket-row .prazo-dot.medio{background:var(--gold)}
.ticket-row .prazo-dot.longo{background:var(--good)}
.ticket-row .name{flex:1;font:500 13px/1.3 Inter,sans-serif}
.ticket-row .amount{font:700 13px/1 Inter,sans-serif;color:var(--ink)}
.ticket-row .amount.saida{color:var(--danger)}
.ticket-row .rowbtns{display:flex;gap:4px}
.ticket-row .rowbtns button{background:none;border:none;color:var(--ink-soft);font-size:11px;cursor:pointer;padding:2px}
.ticket-summary{display:flex;justify-content:space-between;padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.ticket-summary .lbl{font:700 11px/1 Inter,sans-serif;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.ticket-summary .val{font:700 15px/1 Newsreader,Georgia,serif;color:var(--good)}

/* Envelopes 50/30/20 */
.envelopes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.envelope{position:relative;background:var(--card);border:1px solid var(--line);border-radius:0 0 14px 14px;padding:16px 10px 12px;text-align:center;margin-top:14px}
.envelope::before{content:'';position:absolute;left:0;right:0;top:-14px;height:14px;background:var(--track);clip-path:polygon(0 0,50% 100%,100% 0)}
.envelope .tag{font:700 9.5px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.envelope .pct{font:700 20px/1 Newsreader,Georgia,serif;color:var(--ink);margin:0 0 2px}
.envelope .target{font:500 10.5px/1 Inter,sans-serif;color:var(--ink-soft)}
.envelope .bar{height:5px;border-radius:999px;background:var(--track);margin-top:8px;overflow:hidden}
.envelope .bar span{display:block;height:100%}
.envelope.curto .bar span{background:var(--accent2)}
.envelope.medio .bar span{background:var(--gold)}
.envelope.longo .bar span{background:var(--good)}

/* Meta financeira */
.goal-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.goal-select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:500 13px/1 Inter,sans-serif;margin-bottom:10px}

.add-form{display:flex;flex-direction:column;gap:8px}
.add-form input,.add-form select{font:500 13px/1 Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.add-form-row{display:flex;gap:8px}
.add-form-row>*{flex:1}
</style>
</head>
<body>

<div class="brgx-head">
  <a class="brgx-back" href="../index.html">← MEU</a>
  <p class="brgx-eyebrow">MEU.app/caixa · pessoal</p>
  <h1>Caixa</h1>
  <p>Orçamento pessoal — dois ciclos por mês, regra 50/30/20 e meta de economia.</p>
</div>

<div class="brgx-shell">

  <div class="wallet-hero">
    <div class="col"><p class="lbl">Renda do mês</p><p class="val" id="heroRenda">—</p></div>
    <div class="col"><p class="lbl">Gastos fixos</p><p class="val small" id="heroGastos">—</p></div>
    <div class="col"><p class="lbl">Sobra</p><p class="val small" id="heroSobra">—</p></div>
  </div>

  <div id="pendenciasBox"></div>

  <div>
    <p class="section-label" style="margin-bottom:8px">Ciclos do mês</p>
    <div id="ciclos" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>

  <div>
    <p class="section-label" style="margin-bottom:8px">Regra 50 / 30 / 20</p>
    <div class="envelopes" id="envelopes"></div>
  </div>

  <div class="goal-card">
    <p class="section-label" style="margin-bottom:10px">Meta financeira</p>
    <select class="goal-select" id="goalSelect"></select>
    <div id="goalProgress"></div>
    <div class="add-form" style="margin-top:10px">
      <div class="add-form-row">
        <input type="number" id="economiaProgramada" placeholder="Economia programada/mês (R$)" min="0" step="10" />
        <button type="button" class="mini-btn solid" id="salvarEconomiaBtn">Salvar</button>
      </div>
      <button type="button" class="mini-btn" id="lancarEconomiaBtn">Lançar economia deste mês na meta</button>
    </div>
  </div>

  <div>
    <p class="section-label" style="margin-bottom:8px">Avulsos do mês</p>
    <div id="avulsos" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <div class="card">
    <p class="section-label" style="margin-bottom:10px">Lançar recorrência (todo mês)</p>
    <form class="add-form" id="recForm">
      <input type="text" id="recNome" placeholder="Nome (ex: Aluguel)" required />
      <div class="add-form-row">
        <input type="number" id="recValor" placeholder="Valor (R$)" min="0.01" step="0.01" required />
        <select id="recTipo">
          <option value="saida">Saída</option>
          <option value="entrada">Entrada</option>
        </select>
      </div>
      <div class="add-form-row">
        <input type="number" id="recDia" placeholder="Dia do mês" min="1" max="31" required />
        <select id="recPrazo">
          <option value="curto">Curto prazo</option>
          <option value="medio">Médio prazo</option>
          <option value="longo">Longo prazo</option>
        </select>
      </div>
      <button type="submit" class="mini-btn solid">Lançar recorrência</button>
    </form>
  </div>

  <div class="card">
    <p class="section-label" style="margin-bottom:10px">Lançar avulso</p>
    <form class="add-form" id="avulsoForm">
      <input type="text" id="avNome" placeholder="Nome" required />
      <div class="add-form-row">
        <input type="number" id="avValor" placeholder="Valor (R$)" min="0.01" step="0.01" required />
        <select id="avTipo">
          <option value="saida">Saída</option>
          <option value="entrada">Entrada</option>
        </select>
      </div>
      <div class="add-form-row">
        <select id="avPrazo">
          <option value="curto">Curto prazo</option>
          <option value="medio">Médio prazo</option>
          <option value="longo">Longo prazo</option>
        </select>
        <input type="date" id="avData" />
      </div>
      <button type="submit" class="mini-btn solid">Lançar avulso</button>
    </form>
  </div>

</div>

<script src="../assets/brgx-shared.js"></script>
<script>
(function(){
  const PRAZO_LABEL = {curto:'Curto prazo', medio:'Médio prazo', longo:'Longo prazo'};
  const fmt = (v)=> new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);

  let recorrencias = brgxStorageGet('brgx-caixa-recorrencias', [
    {id:'r1', nome:'Salário', valor:5000, tipo:'entrada', diaDoMes:5, prazo:null},
    {id:'r2', nome:'Aluguel', valor:2735, tipo:'saida', diaDoMes:5, prazo:'curto'},
    {id:'r3', nome:'Acordos', valor:50, tipo:'saida', diaDoMes:5, prazo:'curto'},
    {id:'r4', nome:'Internet mãe', valor:100, tipo:'saida', diaDoMes:5, prazo:'curto'},
    {id:'r5', nome:'Claro', valor:80, tipo:'saida', diaDoMes:5, prazo:'curto'},
    {id:'r6', nome:'iCloud', valor:20, tipo:'saida', diaDoMes:5, prazo:'curto'},
    {id:'r7', nome:'Passagem', valor:150, tipo:'saida', diaDoMes:5, prazo:'curto'},
    {id:'r8', nome:'Alimentação', valor:500, tipo:'saida', diaDoMes:5, prazo:'curto'},
    {id:'r9', nome:'Salário', valor:5000, tipo:'entrada', diaDoMes:20, prazo:null},
    {id:'r10', nome:'Passagem', valor:150, tipo:'saida', diaDoMes:20, prazo:'curto'},
    {id:'r11', nome:'Spotify', valor:25, tipo:'saida', diaDoMes:20, prazo:'curto'},
    {id:'r12', nome:'Convênio', valor:270, tipo:'saida', diaDoMes:20, prazo:'curto'},
    {id:'r13', nome:'Internet', valor:100, tipo:'saida', diaDoMes:20, prazo:'curto'},
    {id:'r14', nome:'Luz', valor:100, tipo:'saida', diaDoMes:20, prazo:'curto'},
    {id:'r15', nome:'Alimentação', valor:500, tipo:'saida', diaDoMes:20, prazo:'curto'},
  ]);
  let lancamentos = brgxStorageGet('brgx-caixa-lancamentos', []);
  let economiaProgramada = brgxStorageGet('brgx-caixa-economia-programada', 0);
  let goalId = brgxStorageGet('brgx-caixa-meta-vinculada', null);

  function saveAll(){
    brgxStorageSet('brgx-caixa-recorrencias', recorrencias);
    brgxStorageSet('brgx-caixa-lancamentos', lancamentos);
  }

  function todayYM(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function ymOf(dateStr){ return dateStr ? dateStr.slice(0,7) : null; }
  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }

  function ensureMonthGenerated(){
    const now = new Date();
    const ym = todayYM();
    const dim = daysInMonth(now.getFullYear(), now.getMonth()+1);
    recorrencias.forEach(rec=>{
      const already = lancamentos.some(l => l.recId===rec.id && ymOf(l.data)===ym);
      if (already) return;
      const dia = Math.min(rec.diaDoMes, dim);
      const data = ym + '-' + String(dia).padStart(2,'0');
      lancamentos.push({ id:'l'+Date.now()+Math.random().toString(36).slice(2,6), recId:rec.id, nome:rec.nome, valor:rec.valor, tipo:rec.tipo, prazo:rec.prazo, data });
    });
    saveAll();
  }

  function renderHero(){
    const ym = todayYM();
    const mesLanc = lancamentos.filter(l => ymOf(l.data)===ym);
    const renda = mesLanc.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+l.valor,0);
    const gastos = mesLanc.filter(l=>l.tipo==='saida').reduce((s,l)=>s+l.valor,0);
    document.getElementById('heroRenda').textContent = fmt(renda);
    document.getElementById('heroGastos').textContent = fmt(gastos);
    document.getElementById('heroSobra').textContent = fmt(renda-gastos);
  }

  function renderPendencias(){
    const box = document.getElementById('pendenciasBox');
    const pend = lancamentos.filter(l=>!l.data);
    if (pend.length===0){ box.innerHTML=''; return; }
    box.innerHTML = `<div class="pend-card"><p class="pend-title">Pendências de data (${pend.length})</p><div id="pendList"></div></div>`;
    const list = box.querySelector('#pendList');
    pend.forEach(l=>{
      const row = document.createElement('div');
      row.className = 'pend-row';
      row.innerHTML = `<span style="flex:1">${l.nome} · ${fmt(l.valor)}</span><input type="date" data-id="${l.id}" />`;
      list.appendChild(row);
    });
    list.querySelectorAll('input[type="date"]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const l = lancamentos.find(x=>x.id===inp.dataset.id);
        l.data = inp.value;
        saveAll(); renderAll();
      });
    });
  }

  function renderCiclos(){
    const ym = todayYM();
    const mesLanc = lancamentos.filter(l => ymOf(l.data)===ym && l.recId);
    const dias = [...new Set(recorrencias.map(r=>r.diaDoMes))].sort((a,b)=>a-b);
    const el = document.getElementById('ciclos');
    el.innerHTML = '';
    dias.forEach(dia=>{
      const items = mesLanc.filter(l=>{
        const rec = recorrencias.find(r=>r.id===l.recId);
        return rec && rec.diaDoMes === dia;
      });
      if (items.length===0) return;
      const renda = items.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+l.valor,0);
      const gastos = items.filter(l=>l.tipo==='saida').reduce((s,l)=>s+l.valor,0);
      const ticket = document.createElement('div');
      ticket.className = 'ticket';
      ticket.innerHTML = `
        <div class="ticket-head"><span class="day">Dia ${dia}</span><span class="renda">${fmt(renda)}</span></div>
        <div class="ticket-perf"></div>
        <div class="ticket-body">
          <div class="rows"></div>
          <div class="ticket-summary"><span class="lbl">Dinheiro restante</span><span class="val">${fmt(renda-gastos)}</span></div>
        </div>`;
      const rows = ticket.querySelector('.rows');
      items.filter(l=>l.tipo==='saida').forEach(l=>{
        const row = document.createElement('div');
        row.className = 'ticket-row';
        row.innerHTML = `
          <span class="prazo-dot ${l.prazo||'curto'}"></span>
          <span class="name"></span>
          <span class="amount saida"></span>
          <div class="rowbtns">
            <button data-act="edit" data-id="${l.id}">✎</button>
            <button data-act="del" data-id="${l.id}">✕</button>
          </div>`;
        row.querySelector('.name').textContent = l.nome;
        row.querySelector('.amount').textContent = '− ' + fmt(l.valor);
        rows.appendChild(row);
      });
      el.appendChild(ticket);
    });
    el.querySelectorAll('[data-act="edit"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const l = lancamentos.find(x=>x.id===btn.dataset.id);
        const novo = prompt('Novo valor para "'+l.nome+'"', l.valor);
        const num = parseFloat(novo);
        if (!isNaN(num) && num>0){ l.valor = num; saveAll(); renderAll(); }
      });
    });
    el.querySelectorAll('[data-act="del"]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = await brgxConfirm({title:'Excluir lançamento', text:'Remove só este mês (a recorrência continua ativa pros próximos meses, edite-a se quiser parar). Continuar?', confirmLabel:'Excluir'});
        if (!ok) return;
        lancamentos = lancamentos.filter(x=>x.id!==btn.dataset.id);
        saveAll(); renderAll();
      });
    });
  }

  function renderAvulsos(){
    const ym = todayYM();
    const avulsos = lancamentos.filter(l => !l.recId && ymOf(l.data)===ym);
    const el = document.getElementById('avulsos');
    el.innerHTML = '';
    if (avulsos.length===0){ el.innerHTML = '<p style="color:var(--ink-soft);font-size:13px">Nenhum avulso este mês.</p>'; return; }
    avulsos.forEach(l=>{
      const row = document.createElement('div');
      row.className = 'ticket-row';
      row.style.cssText = 'background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px';
      row.innerHTML = `
        <span class="prazo-dot ${l.prazo||'curto'}"></span>
        <span class="name"></span>
        <span class="amount ${l.tipo==='saida'?'saida':''}"></span>
        <div class="rowbtns"><button data-act="del" data-id="${l.id}">✕</button></div>`;
      row.querySelector('.name').textContent = l.nome;
      row.querySelector('.amount').textContent = (l.tipo==='saida'?'− ':'+ ') + fmt(l.valor);
      el.appendChild(row);
    });
    el.querySelectorAll('[data-act="del"]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = await brgxConfirm({title:'Excluir avulso', text:'Remove esse lançamento avulso. Continuar?', confirmLabel:'Excluir'});
        if (!ok) return;
        lancamentos = lancamentos.filter(x=>x.id!==btn.dataset.id);
        saveAll(); renderAll();
      });
    });
  }

  function renderEnvelopes(){
    const ym = todayYM();
    const mesLanc = lancamentos.filter(l => ymOf(l.data)===ym);
    const renda = mesLanc.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+l.valor,0) || 1;
    const porPrazo = {curto:0, medio:0, longo:0};
    mesLanc.filter(l=>l.tipo==='saida').forEach(l=>{ porPrazo[l.prazo||'curto'] += l.valor; });
    const economiaLancada = brgxStorageGet('brgx-caixa-economia-lancada-'+ym, 0);
    porPrazo.longo += economiaLancada;

    const TARGET = {curto:50, medio:30, longo:20};
    const el = document.getElementById('envelopes');
    el.innerHTML = '';
    ['curto','medio','longo'].forEach(k=>{
      const pct = Math.round(porPrazo[k]/renda*100);
      const div = document.createElement('div');
      div.className = 'envelope ' + k;
      div.innerHTML = `
        <p class="tag">${PRAZO_LABEL[k]}</p>
        <p class="pct">${pct}%</p>
        <p class="target">meta ${TARGET[k]}% · ${fmt(porPrazo[k])}</p>
        <div class="bar"><span style="width:${Math.min(pct/TARGET[k]*100,100)}%"></span></div>`;
      el.appendChild(div);
    });
  }

  function renderGoal(){
    const goals = brgxStorageGet('brgx-metas-goals', []);
    const sel = document.getElementById('goalSelect');
    sel.innerHTML = '<option value="">— nenhuma meta linkada —</option>';
    goals.forEach(g=>{
      const opt = document.createElement('option');
      opt.value = g.id; opt.textContent = g.title;
      if (g.id === goalId) opt.selected = true;
      sel.appendChild(opt);
    });
    const box = document.getElementById('goalProgress');
    const goal = goals.find(g=>g.id===goalId);
    if (!goal){ box.innerHTML = '<p style="color:var(--ink-soft);font-size:12.5px;margin:8px 0 0">Escolha uma meta pra acompanhar a economia aqui.</p>'; return; }
    const valorAlvo = goal.valorAlvo || 0;
    const valorAtual = goal.valorAtual || 0;
    box.innerHTML = `
      <div class="bar-row" style="margin-top:8px">
        <div class="bar"><span style="width:${valorAlvo ? Math.min(100, valorAtual/valorAlvo*100) : 0}%"></span></div>
        <span class="bar-pct">${valorAlvo ? Math.round(valorAtual/valorAlvo*100) : 0}%</span>
      </div>
      <p style="font-size:12px;color:var(--ink-soft);margin:6px 0 0">${fmt(valorAtual)} de ${valorAlvo ? fmt(valorAlvo) : 'sem valor-alvo definido'}</p>`;
    document.getElementById('economiaProgramada').value = economiaProgramada || '';
  }

  function renderAll(){
    renderHero(); renderPendencias(); renderCiclos(); renderAvulsos(); renderEnvelopes(); renderGoal();
  }

  document.getElementById('goalSelect').addEventListener('change', (e)=>{
    goalId = e.target.value || null;
    brgxStorageSet('brgx-caixa-meta-vinculada', goalId);
    renderGoal();
  });

  document.getElementById('salvarEconomiaBtn').addEventListener('click', ()=>{
    const v = parseFloat(document.getElementById('economiaProgramada').value);
    economiaProgramada = isNaN(v) ? 0 : v;
    brgxStorageSet('brgx-caixa-economia-programada', economiaProgramada);
  });

  document.getElementById('lancarEconomiaBtn').addEventListener('click', ()=>{
    if (!goalId){ alert('Escolha uma meta pra linkar primeiro.'); return; }
    const goals = brgxStorageGet('brgx-metas-goals', []);
    const goal = goals.find(g=>g.id===goalId);
    if (!goal) return;
    const ym = todayYM();
    const mesLanc = lancamentos.filter(l => ymOf(l.data)===ym);
    const renda = mesLanc.filter(l=>l.tipo==='entrada').reduce((s,l)=>s+l.valor,0);
    const gastos = mesLanc.filter(l=>l.tipo==='saida').reduce((s,l)=>s+l.valor,0);
    const sobra = renda - gastos;
    const valor = Math.max(0, Math.min(economiaProgramada || sobra, sobra));
    if (valor <= 0){ alert('Não há sobra disponível este mês.'); return; }
    goal.valorAtual = (goal.valorAtual || 0) + valor;
    if (goal.valorAlvo) goal.pct = Math.min(100, Math.round(goal.valorAtual / goal.valorAlvo * 100));
    brgxStorageSet('brgx-metas-goals', goals);
    brgxStorageSet('brgx-caixa-economia-lancada-'+ym, (brgxStorageGet('brgx-caixa-economia-lancada-'+ym,0)) + valor);
    renderAll();
  });

  document.getElementById('recForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const nome = document.getElementById('recNome').value.trim();
    const valor = parseFloat(document.getElementById('recValor').value);
    const tipo = document.getElementById('recTipo').value;
    const diaDoMes = parseInt(document.getElementById('recDia').value, 10);
    const prazo = tipo==='saida' ? document.getElementById('recPrazo').value : null;
    if (!nome || !valor || !diaDoMes) return;
    recorrencias.push({id:'r'+Date.now(), nome, valor, tipo, diaDoMes, prazo});
    saveAll();
    e.target.reset();
    ensureMonthGenerated();
    renderAll();
  });

  document.getElementById('avulsoForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const nome = document.getElementById('avNome').value.trim();
    const valor = parseFloat(document.getElementById('avValor').value);
    const tipo = document.getElementById('avTipo').value;
    const prazo = tipo==='saida' ? document.getElementById('avPrazo').value : null;
    const data = document.getElementById('avData').value || null;
    if (!nome || !valor) return;
    lancamentos.push({id:'l'+Date.now(), recId:null, nome, valor, tipo, prazo, data});
    saveAll();
    e.target.reset();
    renderAll();
  });

  ensureMonthGenerated();
  renderAll();
})();
</script>
<script src="../assets/brgx-specialist.js"></script>
<script>brgxInitSpecialist('chaves');</script>
</body>
