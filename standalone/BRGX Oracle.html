<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#161119" />
<title>MEU · Oráculo</title>
<link rel="stylesheet" href="../assets/brgx-tokens.css" />
<style>
/* Registro noturno deliberado — único app com fundo escuro, dourado como accent primário */
:root{
  --bg:#161119; --ink:#f3ecdd; --ink-soft:#9b8f9e; --line:rgba(243,236,221,0.1);
  --accent:#c9a24c; --accent2:#9c3b3b; --gold:#c9a24c; --card:#211a29; --track:#2b2333;
  --good:#7fa88c; --danger:#b9695b; --danger-soft:rgba(185,105,91,.15); --accent-soft:rgba(201,162,76,.14);
  --hero-dark:#0e0a13;
}
body{padding-bottom:40px}

.reading-hero{background:radial-gradient(120% 140% at 50% 0%, rgba(201,162,76,.16), transparent 60%), var(--card);border:1px solid var(--line);border-radius:26px;padding:28px 22px;text-align:center}
.reading-hero .glyph{font-size:34px;color:var(--accent);font-family:Newsreader,serif;margin-bottom:10px}
.reading-hero p.eyebrow{font:700 10px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px}
.reading-hero p.text{font:italic 500 17px/1.5 Newsreader,Georgia,serif;color:var(--ink);margin:0 0 18px}

.pillars{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pillar-tab{flex:0 0 auto;font:700 11px/1 Inter,sans-serif;letter-spacing:.04em;color:var(--ink-soft);background:var(--track);border:1px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer}
.pillar-tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pillar-body{font:400 13.5px/1.6 Inter,sans-serif;color:var(--ink)}

.history-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.history-row:last-child{border-bottom:none}
.history-date{flex:0 0 64px;font:700 11px/1.4 Inter,sans-serif;color:var(--ink-soft)}
.history-text{flex:1;font:400 13px/1.5 Newsreader,Georgia,serif;color:var(--ink)}
.history-actions{display:flex;gap:6px;flex:0 0 auto}
.history-actions button{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer}
.history-actions button.danger{color:var(--danger)}
.reflected-tag{display:inline-block;margin-top:4px;font:700 9.5px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
</style>
</head>
<body>

<div class="brgx-head">
  <a class="brgx-back" href="../index.html">← MEU</a>
  <p class="brgx-eyebrow">MEU.app/oraculo · pessoal</p>
  <h1>Oráculo</h1>
  <p>Leitura do dia com 5 pilares: Astrologia, Numerologia, Kabbalah, The Pattern, Tiferet.</p>
</div>

<div class="brgx-shell">

  <div class="reading-hero">
    <p class="eyebrow" id="readingDate">carregando…</p>
    <p class="glyph">✦</p>
    <p class="text" id="readingText">Toque em "gerar leitura" para abrir o dia.</p>
    <div class="btn-row">
      <button class="mini-btn solid" id="genBtn">Gerar leitura do dia</button>
      <button class="mini-btn" id="reflectBtn">Marcar refletido</button>
    </div>
  </div>

  <div>
    <p class="section-label" style="margin-bottom:8px">Pilares</p>
    <div class="pillars" id="pillars"></div>
    <div class="card" style="margin-top:8px">
      <p class="pillar-body" id="pillarBody"></p>
    </div>
  </div>

  <div class="card">
    <p class="section-label" style="margin-bottom:4px">Histórico de leituras</p>
    <div id="history"></div>
  </div>

</div>

<script src="../assets/brgx-shared.js"></script>
<script>
(function(){
  const PILLARS = {
    astrologia: 'O céu de hoje pede atenção ao que já está em movimento, não ao que ainda falta começar.',
    numerologia: 'O número do dia favorece fechamentos — o que está 90% pronto merece ir para 100%.',
    kabbalah: 'A árvore aponta para equilíbrio entre rigor e expansão. Nenhum dos dois sozinho resolve.',
    thepattern: 'Seu padrão de hoje tende à autocobrança. Vale nomear isso antes de agir a partir dele.',
    tiferet: 'Beleza e verdade pedem para caminhar juntas — não escolha uma em detrimento da outra hoje.'
  };
  const PILLAR_LABEL = {astrologia:'Astrologia', numerologia:'Numerologia', kabbalah:'Kabbalah', thepattern:'The Pattern', tiferet:'Tiferet'};

  let readings = brgxStorageGet('brgx-oracle-readings', []);
  let activePillar = 'astrologia';

  function save(){ brgxStorageSet('brgx-oracle-readings', readings); }
  function todayKey(){ return new Date().toISOString().slice(0,10); }

  function renderHero(){
    const today = readings.find(r=>r.date===todayKey());
    document.getElementById('readingDate').textContent = brgxDateLine();
    document.getElementById('readingText').textContent = today ? today.text : 'Toque em "gerar leitura" para abrir o dia.';
    document.getElementById('reflectBtn').textContent = today && today.reflected ? '✓ Refletido' : 'Marcar refletido';
  }

  function renderPillars(){
    const el = document.getElementById('pillars');
    el.innerHTML = '';
    Object.keys(PILLARS).forEach(key=>{
      const b = document.createElement('button');
      b.className = 'pillar-tab' + (key===activePillar?' active':'');
      b.textContent = PILLAR_LABEL[key];
      b.addEventListener('click', ()=>{ activePillar = key; renderPillars(); });
      el.appendChild(b);
    });
    document.getElementById('pillarBody').textContent = PILLARS[activePillar];
  }

  function renderHistory(){
    const el = document.getElementById('history');
    el.innerHTML = '';
    if(readings.length===0){
      el.innerHTML = '<p style="color:var(--ink-soft);font-size:13px">Nenhuma leitura arquivada ainda.</p>';
      return;
    }
    [...readings].reverse().forEach(r=>{
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `
        <div class="history-date"></div>
        <div style="flex:1">
          <p class="history-text"></p>
          ${r.reflected ? '<span class="reflected-tag">Refletido</span>' : ''}
        </div>
        <div class="history-actions">
          <button data-act="edit" data-id="${r.id}" title="Editar nota">✎</button>
          <button data-act="del" data-id="${r.id}" class="danger" title="Arquivar / excluir">✕</button>
        </div>`;
      row.querySelector('.history-date').textContent = r.date;
      row.querySelector('.history-text').textContent = r.text;
      el.appendChild(row);
    });

    el.querySelectorAll('[data-act="edit"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const r = readings.find(x=>x.id===btn.dataset.id);
        const novo = prompt('Editar nota da leitura', r.text);
        if(novo && novo.trim()){ r.text = novo.trim(); save(); renderHistory(); renderHero(); }
      });
    });
    el.querySelectorAll('[data-act="del"]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = await brgxConfirm({title:'Arquivar leitura', text:'Essa leitura sai do histórico. Continuar?', confirmLabel:'Excluir'});
        if(!ok) return;
        readings = readings.filter(r=>r.id!==btn.dataset.id);
        save(); renderHistory(); renderHero();
      });
    });
  }

  document.getElementById('genBtn').addEventListener('click', ()=>{
    const key = todayKey();
    if(readings.find(r=>r.date===key)) return;
    const text = PILLARS[activePillar];
    readings.push({id:'r'+Date.now(), date:key, text, reflected:false});
    save(); renderHero(); renderHistory();
  });

  document.getElementById('reflectBtn').addEventListener('click', ()=>{
    const key = todayKey();
    let today = readings.find(r=>r.date===key);
    if(!today) return;
    today.reflected = !today.reflected;
    save(); renderHero(); renderHistory();
  });

  renderHero();
  renderPillars();
  renderHistory();
})();
</script>
</body>
</html>
