<style>
/* Registro noturno deliberado — único app com fundo escuro, dourado como accent primário */
:root{
  --bg:#161119; --ink:#f3ecdd; --ink-soft:#9b8f9e; --line:rgba(243,236,221,0.1);
  --accent:#c9a24c; --accent2:#9c3b3b; --gold:#c9a24c; --card:#211a29; --track:#2b2333;
  --good:#7fa88c; --danger:#b9695b; --danger-soft:rgba(185,105,91,.15); --accent-soft:rgba(201,162,76,.14);
  --hero-dark:#0e0a13;
}
body{padding-bottom:40px}

.mode-toggle{display:flex;gap:8px}
.mode-toggle button{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);font:600 12px/1.3 Inter,sans-serif;cursor:pointer}
.mode-toggle button.active{background:var(--accent);border-color:var(--accent);color:#161119}
.mode-explain{font:400 11.5px/1.5 Inter,sans-serif;color:var(--ink-soft);margin:0}

.gen-row{display:flex;gap:8px}
.gen-row input[type="date"]{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 13px/1 Inter,sans-serif}

.reading-hero{background:radial-gradient(120% 140% at 50% 0%, rgba(201,162,76,.16), transparent 60%), var(--card);border:1px solid var(--line);border-radius:26px;padding:24px 22px}
.reading-hero .subtitle{font:700 10px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.reading-hero .title{font:italic 600 22px/1.3 Newsreader,Georgia,serif;color:var(--ink);margin:0 0 14px}
.reading-hero p.par{font:400 13.5px/1.65 Inter,sans-serif;color:var(--ink);margin:0 0 12px}
.reading-hero .tags{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.reading-hero .tags span{font:700 9.5px/1 Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;padding:5px 10px;border-radius:999px;background:var(--track);color:var(--ink-soft)}

.voice-row{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.voice-btn{background:none;border:none;color:var(--accent);font:600 12.5px/1 Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.voice-gear{background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer}
.voice-picker{margin-top:10px;padding:12px;background:var(--track);border-radius:12px;max-height:180px;overflow-y:auto}
.voice-picker .vopt{padding:7px 8px;font:500 12px/1.3 Inter,sans-serif;color:var(--ink);cursor:pointer;border-radius:6px}
.voice-picker .vopt.active{color:var(--accent);font-weight:700}

.history-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.history-row:last-child{border-bottom:none}
.history-date{flex:1;font:600 13px/1.4 Inter,sans-serif;color:var(--ink);cursor:pointer}
.history-sub{display:block;font:400 11px/1.3 Inter,sans-serif;color:var(--ink-soft);margin-top:2px}
.history-actions{display:flex;gap:6px;flex:0 0 auto}
.history-actions button{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer}
.history-actions button.danger{color:var(--danger)}
.reflected-tag{color:var(--good) !important}

function parseLocalDate(dateStr) { const [y, m, d] = dateStr.split('-').map(Number); return new Date(y, m - 1, d); }
function getDayOfWeek(date) { const days = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado']; return days[parseLocalDate(date).getDay()]; }

class OracleStorage {
  static key = 'oracle-readings';
  static getAll() { try { return JSON.parse(localStorage.getItem(this.key) || '{}'); } catch { return {}; } }
  static save(date, data) { const r = this.getAll(); r[date] = { ...data, timestamp: new Date().toISOString() }; localStorage.setItem(this.key, JSON.stringify(r)); }
  static get(date) { return this.getAll()[date] || null; }
  static remove(date) { const r = this.getAll(); delete r[date]; localStorage.setItem(this.key, JSON.stringify(r)); }
  static history() { return Object.keys(this.getAll()).sort().reverse(); }
}

const AstrologyEngine = {
  signos: [
    { nome: 'Capricórnio', de: [12, 22], ate: [1, 19], elemento: 'Terra', regente: 'Saturno' },

  fasesLua: ['Lua Nova', 'Lua Crescente', 'Quarto Crescente', 'Gibosa Crescente', 'Lua Cheia', 'Gibosa Minguante', 'Quarto Minguante', 'Lua Minguante'],
  calcularSignoSolar(d) {
    const m = d.getMonth() + 1, dia = d.getDate();
    for (const s of this.signos) {
      const [dm, dd] = s.de, [am, ad] = s.ate;
      if (dm > am) {
        if ((m === dm && dia >= dd) || (m === am && dia <= ad)) return s;
      } else {
        if ((m === dm && dia >= dd) || (m === am && dia <= ad) || (m > dm && m < am)) return s;
      }
    }
    return this.signos[0];
  },
  calcularFaseLua(d) {
    const luaNovaRef = Date.UTC(2000, 0, 6, 18, 14);
    const diffDias = (d.getTime() - luaNovaRef) / 86400000;
    const cicloSinodico = 29.53058867;
    let idx = ((diffDias % cicloSinodico) / cicloSinodico) * 8;
    idx = Math.floor(((idx % 8) + 8) % 8);
    const iluminacao = Math.round(50 * (1 - Math.cos((diffDias % cicloSinodico) / cicloSinodico * 2 * Math.PI)));
    return { nome: this.fasesLua[idx], iluminacaoPct: iluminacao };
  },
  calculate(date) {
    const d = parseLocalDate(date);
    const signo = this.calcularSignoSolar(d);
    const lua = this.calcularFaseLua(d);
    return { signo, lua };
  }
};

    const yearNum = this.reduceToSingle(d.getFullYear());
    const total = this.reduceToSingle(dayNum + monthNum + yearNum);

function generateIntegratedReading(date, memorial) {
  const num = NumerologyEngine.calculate(date);
  const numMeaning = NumerologyEngine.meanings[num.total] || 'equilíbrio entre polaridades';
  const astro = AstrologyEngine.calculate(date);
  const kab = KabbalaEngine.calculate(date);
  const kabSefiraMeaning = KabbalaEngine.sefirot[kab.activeSefira];
  const patt = ThePatternEngine.calculate(date);
  const tif = TiferetEngine.calculate(date);
  const dayOfWeek = getDayOfWeek(date);
  const d = parseLocalDate(date);
  const idx = d.getDate() % EMOTIONAL_TITLES.length;

  const m = memorial;
  const perfil = m.perfil;
  const parte = m.partesInternas[d.getDate() % m.partesInternas.length];
  const padrao = m.padroesCentrais[(d.getDate() + 2) % m.padroesCentrais.length];
  const gatilho = m.gatilhos[(d.getDate() + 1) % m.gatilhos.length];
  const regulador = m.reguladores[d.getDate() % m.reguladores.length];
  const sabotador = m.sabotadores[d.getDate() % m.sabotadores.length];
  const sombra = m.sombra[(d.getDate() + 1) % m.sombra.length];

  const signoNatal = AstrologyEngine.signos.find((s) => s.nome === perfil.sol);
  const relacaoElementar = signoNatal
    ? (ELEMENTOS_RELACAO[signoNatal.elemento + '|' + astro.signo.elemento] || 'o dia conversa com seu Sol natal sem atrito nem reforço direto')
    : '';

  const tiferetEhRegente = kab.activeSefira === 'Tiferet';
  const fraseRegencia = tiferetEhRegente
    ? 'Hoje o Sol rege diretamente — Tiferet está ativa, e o trânsito solar está em ' + astro.signo.nome + '.'
    : 'Quem rege hoje é ' + kab.planetaRegente + ' (' + kab.activeSefira + ' — ' + kabSefiraMeaning + '), enquanto o Sol trânsita por ' + astro.signo.nome + '; Tiferet, seu centro, recebe essa energia por refração.';

  const paragrafo1 =
    fraseRegencia + ' Seu Sol natal está em ' + perfil.sol + ' (' + (signoNatal ? signoNatal.elemento : '') + ') — ' + relacaoElementar + '. ' +
    'A Lua está em ' + astro.lua.nome.toLowerCase() + ', com cerca de ' + astro.lua.iluminacaoPct + '% de iluminação, e seu Ascendente em ' + perfil.ascendente + ' costuma ser a primeira reação que os outros veem em você hoje.';

  const paragrafo2 =
    'O número do dia é ' + num.total + ': ' + numMeaning + '. Seu Caminho de Vida é ' + perfil.vidaCaminho + ' — a leitura de hoje conversa com essa base, não a substitui. ' +
    'A parte sua mais ativa agora é ' + parte.nome + (parte.fala ? (', que costuma dizer "' + parte.fala + '"') : '') + ': a virtude dela é ' + parte.virtude + ', e o risco, se ela assumir sozinha, é ' + (parte.risco || 'perder o equilíbrio com as outras partes') + '.';

  const paragrafo3 =
    padrao + ' Na prática, isso aparece como ' + patt.behavior + ', puxado por ' + sabotador + ', com ' + sombra + ' logo atrás. ' +
    'Se ' + gatilho + ' aparecer hoje, ' + regulador + ' é o que te traz de volta ao centro. O convite é ' + tif.theme + ' — e a regra que vale lembrar: "' + m.novaRegraInterna + '"';

  return {
    subtitle: dayOfWeek.toUpperCase() + ' · NÚMERO ' + num.total + ' · ' + astro.lua.nome,
    title: EMOTIONAL_TITLES[idx],
    paragrafos: [paragrafo1, paragrafo2, paragrafo3],
    canais: ['Astrologia', 'Numerologia', 'Kabbalah', 'The Pattern', 'Tiferet', 'Memorial BRGX'],
  };
}

const IChingEngine = {
  trigramas: [
    { nome: 'Qian (Céu)', simbolo: '☰', qualidade: 'força criativa, iniciativa pura' },
    { nome: 'Dui (Lago)', simbolo: '☱', qualidade: 'alegria serena, troca aberta' },
    { nome: 'Li (Fogo)', simbolo: '☲', qualidade: 'clareza, adesão luminosa, visão' },
    { nome: 'Zhen (Trovão)', simbolo: '☳', qualidade: 'movimento súbito, despertar, choque' },
    { nome: 'Xun (Vento)', simbolo: '☴', qualidade: 'penetração suave, influência gradual' },
    { nome: 'Kan (Água)', simbolo: '☵', qualidade: 'perigo profundo, perseverança no abismo' },
    { nome: 'Gen (Montanha)', simbolo: '☶', qualidade: 'quietude, limite, parada necessária' },
    { nome: 'Kun (Terra)', simbolo: '☷', qualidade: 'receptividade absoluta, sustentação' },
  ],
  calcularHexagrama(date) {
    const d = parseLocalDate(date);
    const soma = d.getDate() + (d.getMonth() + 1) + d.getFullYear();
    const idxSuperior = soma % 8;
    const idxInferior = (soma * 3 + d.getDate()) % 8;
    return { superior: this.trigramas[idxSuperior], inferior: this.trigramas[idxInferior] };
  },
  calculate(date) {
    const hex = this.calcularHexagrama(date);
    const leitura = hex.superior.nome === hex.inferior.nome
      ? `dobrado: ${hex.superior.nome} sobre ${hex.inferior.nome}, a mesma força se intensifica sozinha`
      : `${hex.superior.nome} acima de ${hex.inferior.nome}: ${hex.superior.qualidade} pressionando sobre ${hex.inferior.qualidade}`;
    return { ...hex, leitura };
  },
};

function classificarConvergencia(temas) {
  const stopwords = ['de', 'da', 'do', 'com', 'que', 'para', 'sem', 'ou', 'e', 'a', 'o', 'em'];
  const palavras = temas.flatMap((t) => t.toLowerCase().split(/\s+/).filter((w) => w.length > 3 && !stopwords.includes(w)));
  const freq = {};
  palavras.forEach((p) => { freq[p] = (freq[p] || 0) + 1; });
  return Object.entries(freq).filter(([, c]) => c >= 2).map(([w]) => w);
}

function sintetizarOraculo(date) {
  const astro = AstrologyEngine.calculate(date);
  const num = NumerologyEngine.calculate(date);
  const kab = KabbalaEngine.calculate(date);
  const patt = ThePatternEngine.calculate(date);
  const tif = TiferetEngine.calculate(date);
  const tarot = TarotEngine.calculate(date);
  const jung = JungEngine.calculate(date);
  const estoico = EstoicismoEngine.calculate(date);
  const iching = IChingEngine.calculate(date);

  const kabSefiraMeaning = KabbalaEngine.sefirot[kab.activeSefira];
  const numMeaning = NumerologyEngine.meanings[num.total] || 'equilíbrio entre polaridades';

  const fontes = [
    { nome: 'Astrologia', tema: `Sol em ${astro.signo.nome}, ${astro.lua.nome}` },
    { nome: 'Numerologia', tema: numMeaning },
    { nome: 'Kabbalah', tema: kabSefiraMeaning },
    { nome: 'The Pattern', tema: patt.pattern },
    { nome: 'Tiferet', tema: tif.theme },
    { nome: 'Tarot', tema: tarot.tema },
    { nome: 'Jung', tema: jung.foco },
    { nome: 'Estoicismo', tema: estoico.orientacao },
    { nome: 'I Ching', tema: `Hexagrama ${iching.superior.simbolo}${iching.inferior.simbolo}: ${iching.leitura}` },
  ];

  const convergencias = classificarConvergencia(fontes.map((f) => f.tema));
  const nivelConvergencia = convergencias.length >= 2 ? 'alta' : convergencias.length === 1 ? 'moderada' : 'baixa';

  const aberturaConvergencia = nivelConvergencia === 'alta'
    ? 'Várias camadas apontam para a mesma direção hoje — quando astrologia, arquétipos e ferramentas simbólicas concordam, vale prestar atenção redobrada.'
    : nivelConvergencia === 'moderada'
    ? 'Há uma linha de sentido comum entre algumas das fontes consultadas, mesmo que nem todas apontem exatamente para o mesmo lugar.'
    : 'As fontes de hoje trazem ângulos diferentes — isso não é contradição, é um convite a olhar a situação por mais de um lado antes de decidir.';

  return {
    subtitle: `SÍNTESE ORÁCULO · ${getDayOfWeek(date).toUpperCase()}`,
    title: `Convergência ${nivelConvergencia}`,
    paragrafos: [
      aberturaConvergencia,
      `O arquétipo de ${jung.nome} está ativo — ${jung.foco}. Isso conversa com o tema de ${tarot.nome}: ${tarot.tema}.`,
      `Do ponto de vista simbólico, ${kabSefiraMeaning} sustenta o convite de ${tif.theme}. O padrão comportamental do dia (${patt.pattern}) reforça essa direção.`,
      `O I Ching traz ${iching.superior.simbolo} sobre ${iching.inferior.simbolo}: ${iching.leitura}.`,
      `Na prática, o princípio estoico de ${estoico.nome} orienta o caminho: ${estoico.orientacao}.`,
    ],
    canais: fontes.map((f) => f.nome),
  };
}

/* ===== Voz — portado de standalone/BRGX Oracle.html (main) ===== */

function vozPreferidaMasculina(vozes) {
  const MASC = ['felipe', 'daniel', 'joaquim', 'ricardo', 'antonio', 'antônio', 'thiago', 'bruno', 'marcos', 'paulo', 'carlos', 'diego', 'eddy', 'reed', 'rocko', 'male', 'masculin', 'homem'];
  const FEM = ['luciana', 'joana', 'maria', 'catarina', 'fernanda', 'ines', 'inês', 'francisca', 'female', 'feminin', 'mulher', 'google portugu', 'flo', 'sandy', 'shelley'];
  const BOA = ['enhanced', 'premium', 'neural', 'natural', 'siri'];
  const nota = (v) => {
    const n = (v.name || '').toLowerCase();
    const lang = (v.lang || '').toLowerCase().replace('_', '-');
    let s = 0;
    if (MASC.some((m) => n.includes(m))) s += 100;
    if (FEM.some((f) => n.includes(f))) s -= 80;
    if (BOA.some((b) => n.includes(b))) s += 40;
    if (lang.indexOf('pt-br') === 0) s += 10; else if (lang.indexOf('pt') === 0) s += 4;
    if (v.localService) s += 5;
    return s;
  };
  return vozes.slice().sort((a, b) => nota(b) - nota(a))[0] || null;
}

function segmentarFala(texto) {
  const partes = String(texto).replace(/[—–]/g, ',').split(/([.!?…]+)/);
  const frases = [];
  for (let i = 0; i < partes.length; i += 2) {
    const corpo = (partes[i] || '').trim();
    const pont = partes[i + 1] || '';
    if (corpo) frases.push(corpo + pont);
  }
  return frases.length ? frases : [String(texto).trim()].filter(Boolean);
}

let vozesDisponiveis = [];
let vozTocando = false;

function carregarVozesPTBR() {
  const todas = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  vozesDisponiveis = todas.filter((v) => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith('pt'));
  return vozesDisponiveis;
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = carregarVozesPTBR;
  let tentativas = 0;
  (function poll(){ tentativas++; const p = carregarVozesPTBR(); if(!p.length && tentativas < 12) setTimeout(poll, 400); })();
}

function pegarVoz() {
  const vozes = vozesDisponiveis.length ? vozesDisponiveis : carregarVozesPTBR();
  const nomeSalvo = localStorage.getItem('brgx-voz-nome');
  if (nomeSalvo) { const esc = vozes.find(v => v.name === nomeSalvo); if (esc) return esc; }
  return vozPreferidaMasculina(vozes);
}

function ouvirTexto(texto, onDone){
  if (!('speechSynthesis' in window)) return;
  if (vozTocando) { window.speechSynthesis.cancel(); vozTocando = false; onDone(); return; }
  window.speechSynthesis.cancel();
  const voz = pegarVoz();
  const frases = segmentarFala(texto);
  if (!frases.length) return;
  vozTocando = true;
  (function falarIndice(i){
    if (i >= frases.length) { vozTocando = false; onDone(); return; }
    const utter = new SpeechSynthesisUtterance(frases[i]);
    utter.lang = 'pt-BR'; if (voz) utter.voice = voz; utter.rate = 0.9; utter.pitch = 0.62;
    utter.onend = () => { if (vozTocando) setTimeout(() => falarIndice(i + 1), 260); };
    utter.onerror = () => { vozTocando = false; onDone(); };
    window.speechSynthesis.speak(utter);
  })(0);
}

/* ===== UI vanilla — layout noturno do redesign, dados/lógica reais acima ===== */

let modo = 'leitura';
let currentReading = null;

function todayStr(){ return new Date().toISOString().slice(0,10); }
document.getElementById('dateInput').value = todayStr();

function setModo(m){
  modo = m;
  document.getElementById('modeLeitura').classList.toggle('active', m==='leitura');
  document.getElementById('modeSintese').classList.toggle('active', m==='sintese');
  document.getElementById('modeExplain').textContent = m==='leitura'
    ? 'Astrologia, Numerologia, Kabbalah, The Pattern, Tiferet e o Memorial BRGX, costurados numa narrativa única.'
    : 'Cruza astrologia, numerologia, Kabbalah, The Pattern, Tiferet, Tarot, Jung, Estoicismo e I Ching, ponderando convergências.';
  loadForDate(document.getElementById('dateInput').value);
}
document.getElementById('modeLeitura').addEventListener('click', ()=>setModo('leitura'));
document.getElementById('modeSintese').addEventListener('click', ()=>setModo('sintese'));

function renderReading(data){
  currentReading = data;
  const box = document.getElementById('readingBox');
  if (!data){ box.innerHTML = ''; return; }
  box.innerHTML = `
    <div class="reading-hero">
      <p class="subtitle"></p>
      <p class="title"></p>
      <div class="pars"></div>
      <div class="tags"></div>
      <div class="voice-row">
        <button class="voice-btn" id="ouvirBtn">🔊 Ouvir leitura</button>
        <button class="voice-gear" id="vozGear" title="Escolher voz">⚙</button>
        ${data.reflected ? '<span class="reflected-tag" style="font:700 11px/1 Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-left:auto">✓ Refletido</span>' : ''}
      </div>
      <div class="voice-picker" id="vozPicker" style="display:none"></div>
      <div class="btn-row" style="margin-top:14px">
        <button class="mini-btn" id="reflectBtn">${data.reflected ? '✓ Refletido' : 'Marcar refletido'}</button>
      </div>
    </div>`;
  box.querySelector('.subtitle').textContent = data.subtitle;
  box.querySelector('.title').textContent = data.title;
  const pars = box.querySelector('.pars');
  (data.paragrafos||[]).forEach(p=>{ const el=document.createElement('p'); el.className='par'; el.textContent=p; pars.appendChild(el); });
  const tags = box.querySelector('.tags');
  (data.canais||[]).forEach(c=>{ const s=document.createElement('span'); s.textContent=c; tags.appendChild(s); });

  document.getElementById('ouvirBtn').addEventListener('click', ()=>{
    const btn = document.getElementById('ouvirBtn');
    ouvirTexto([data.title, ...(data.paragrafos||[])].join(' '), ()=>{ btn.textContent = '🔊 Ouvir leitura'; });
    btn.textContent = vozTocando ? '⏸ Parar' : '🔊 Ouvir leitura';
  });
  document.getElementById('vozGear').addEventListener('click', ()=>{
    const picker = document.getElementById('vozPicker');
    const open = picker.style.display !== 'none';
    if (open) { picker.style.display = 'none'; return; }
    const vozes = vozesDisponiveis.length ? vozesDisponiveis : carregarVozesPTBR();
    const nomeSalvo = localStorage.getItem('brgx-voz-nome');
    picker.innerHTML = vozes.length ? '' : '<p style="font-size:11.5px;color:var(--ink-soft);margin:0">Nenhuma voz em português encontrada neste navegador.</p>';
    vozes.forEach(v=>{
      const opt = document.createElement('div');
      opt.className = 'vopt' + (v.name===nomeSalvo ? ' active' : '');
      opt.textContent = (v.name===nomeSalvo ? '● ' : '○ ') + v.name + ' (' + v.lang + ')';
      opt.addEventListener('click', ()=>{ localStorage.setItem('brgx-voz-nome', v.name); picker.style.display='none'; });
      picker.appendChild(opt);
    });
    picker.style.display = 'block';
  });
  document.getElementById('reflectBtn').addEventListener('click', ()=>{
    data.reflected = !data.reflected;
    OracleStorage.save(data.date, data);
    renderReading(data);
    renderHistory();
  });
}

function loadForDate(date){
  const stored = OracleStorage.get(date);
  if (stored && stored._modo === modo) { renderReading(stored); return; }
  renderReading(null);
}

document.getElementById('genBtn').addEventListener('click', ()=>{
  const date = document.getElementById('dateInput').value || todayStr();
  const r = modo === 'leitura' ? generateIntegratedReading(date, MemorialStore.get()) : sintetizarOraculo(date);
  const data = { date, _modo: modo, dayOfWeek: getDayOfWeek(date), subtitle: r.subtitle, title: r.title, paragrafos: r.paragrafos, canais: r.canais, reflected: false };
  OracleStorage.save(date, data);
  renderReading(data);
  renderHistory();
});

function renderHistory(){
  const el = document.getElementById('history');
  const dates = OracleStorage.history();
  el.innerHTML = '';
  if (dates.length===0){
    el.innerHTML = '<p style="color:var(--ink-soft);font-size:13px">Nenhuma leitura salva ainda.</p>';
    return;
  }
  dates.slice(0,15).forEach(date=>{
    const entry = OracleStorage.get(date);
    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = `
      <div class="history-date">
        ${new Date(date+'T00:00:00').toLocaleDateString('pt-BR')} — ${getDayOfWeek(date)}
        <span class="history-sub"></span>
      </div>
      <div class="history-actions"><button data-id="${date}" class="danger">excluir</button></div>`;
    row.querySelector('.history-sub').textContent = (entry && entry.title) ? entry.title + (entry.reflected ? ' · refletido' : '') : '';
    row.querySelector('.history-date').addEventListener('click', ()=>{
      document.getElementById('dateInput').value = date;
      if (entry) { modo = entry._modo || 'leitura'; setModo(modo); renderReading(entry); }
    });
    el.appendChild(row);
  });
  el.querySelectorAll('[data-id]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ok = await brgxConfirm({title:'Excluir leitura', text:'Essa leitura sai do histórico permanentemente. Continuar?', confirmLabel:'Excluir'});
      if (!ok) return;
      OracleStorage.remove(btn.dataset.id);
      renderHistory();
      if (currentReading && currentReading.date===btn.dataset.id) renderReading(null);
    });
  });
}

loadForDate(todayStr());
renderHistory();
})();
</script>
